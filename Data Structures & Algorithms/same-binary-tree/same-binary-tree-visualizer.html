/* ==========================================================================
   Structural renderers.

   These exist because every panel above this line is a row of boxes. With only
   those, a tree came out as "nodes grouped by depth" and a stack as a row of
   chips - the animation was correct and the shape was a lie. The rule they all
   follow: the PROBLEM object supplies data, the chassis does every bit of
   layout arithmetic. A generated definition that had to compute its own x and y
   would be a generated definition that silently drifts.
   ========================================================================== */

/* The density dial, clamped. A panel may ask to be drawn smaller so a big
   structure fits one screen; it may not ask to be drawn illegibly. */
const SCALE_MIN = 0.7;
function pscale(p){
  const v = Number(p && p.scale);
  return Number.isFinite(v) ? Math.min(1, Math.max(SCALE_MIN, v)) : 1;
}

/* Rebuild a container's children only when the *identity* of what it holds
   changes. Keeping elements between steps is what makes a node glide to its new
   position instead of blinking there. */
function keyed(el, key){
  if (el.dataset.key === key) return false;
  el.dataset.key = key;
  el.innerHTML = '';
  return true;
}

const SVG_NS = 'http://www.w3.org/2000/svg';
const mkSvg = (name) => document.createElementNS(SVG_NS, name);

/* ---------------- shared tree layout ----------------
   Used by both the tree panel and the heap panel, which is a tree with its
   edges implied by array indices. Leaves take the next free column; a parent
   centres over its children. Depth comes from the parent chain, so the caller
   never states a depth and cannot state a wrong one. */
function layoutTree(nodes, k){
  const byId = new Map();
  const kids = new Map();
  const roots = [];
  const work = nodes.map((n) => ({
    id: String(n.id), v: n.v,
    parent: (n.parent === null || n.parent === undefined) ? null : String(n.parent),
    side: n.side || '', cls: n.cls || '', sub: n.sub, edgeCls: n.edgeCls || '',
    nil: n.v === null || n.v === undefined,
  }));
  work.forEach((n) => { byId.set(n.id, n); kids.set(n.id, []); });
  work.forEach((n) => {
    if (n.parent !== null && kids.has(n.parent)) kids.get(n.parent).push(n.id);
    else { n.parent = null; roots.push(n.id); }
  });
  // Left child first when sides are given, otherwise the order they arrived in.
  const rank = (id) => (byId.get(id).side === 'L' ? 0 : byId.get(id).side === 'R' ? 2 : 1);
  kids.forEach((list) => list.sort((a, b) => rank(a) - rank(b)));

  const X = new Map(), D = new Map(), seen = new Set();
  let col = 0;
  const walk = (id, d) => {
    if (seen.has(id)) return;          // malformed data must not hang the page
    seen.add(id);
    D.set(id, d);
    const cs = kids.get(id) || [];
    if (!cs.length){ X.set(id, col++); return; }
    cs.forEach((c) => walk(c, d + 1));
    const xs = cs.map((c) => X.get(c)).filter((x) => x !== undefined);
    X.set(id, xs.length ? (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2 : col++);
  };
  roots.forEach((r) => { walk(r, 0); col += 0.7; });
  work.forEach((n) => { if (!seen.has(n.id)) { D.set(n.id, 0); X.set(n.id, col++); } });

  const NODE = 54 * k, GAPX = 24 * k, ROWH = 82 * k, PAD = 34 * k;
  const maxD = Math.max(0, ...work.map((n) => D.get(n.id) || 0));
  const maxX = Math.max(0, ...work.map((n) => X.get(n.id) || 0));
  work.forEach((n) => {
    n.px = PAD + NODE / 2 + (X.get(n.id) || 0) * (NODE + GAPX);
    n.py = PAD + NODE / 2 + (D.get(n.id) || 0) * ROWH;
  });
  return {
    work, byId,
    width: PAD * 2 + NODE + maxX * (NODE + GAPX),
    height: PAD * 2 + NODE + maxD * ROWH,
  };
}

/* Draw a laid-out tree into a .tree-stage. Edges are one SVG layer under
   absolutely positioned node divs, so edges never paint over a value. */
function drawTree(stage, nodes, p, k){
  const L = layoutTree(nodes, k);
  const links = p.links || [];
  stage.style.width = L.width + 'px';
  stage.style.height = L.height + 'px';

  let svg = stage.querySelector('svg');
  if (!svg){ svg = mkSvg('svg'); stage.insertBefore(svg, stage.firstChild); }
  // Sized in pixels, NOT with a viewBox stretched to 100%. The nodes are
  // positioned in pixels, so anything that scales the edge layer independently
  // - which min-width:100% on the stage does the moment the tree is narrower
  // than the panel - draws the edges somewhere the nodes are not.
  svg.setAttribute('width', L.width);
  svg.setAttribute('height', L.height);
  svg.setAttribute('viewBox', '0 0 ' + L.width + ' ' + L.height);

  const edges = L.work.filter((n) => n.parent !== null && L.byId.has(n.parent))
    .map((n) => ({key: n.parent + '>' + n.id, a: L.byId.get(n.parent), b: n, cls: n.edgeCls, label: ''}))
    .concat(links.filter((e) => L.byId.has(String(e.from)) && L.byId.has(String(e.to)))
      .map((e) => ({key: 'x' + e.from + '>' + e.to, a: L.byId.get(String(e.from)), b: L.byId.get(String(e.to)),
                    cls: e.cls || 'ghost', label: e.label || ''})));

  if (keyed(svg, edges.map((e) => e.key).join('|'))){
    edges.forEach(() => { svg.appendChild(mkSvg('line')); svg.appendChild(mkSvg('text')); });
  }
  edges.forEach((e, i) => {
    const line = svg.children[i * 2], text = svg.children[i * 2 + 1];
    line.setAttribute('class', 'edge ' + (e.cls || ''));
    line.setAttribute('x1', e.a.px); line.setAttribute('y1', e.a.py);
    line.setAttribute('x2', e.b.px); line.setAttribute('y2', e.b.py);
    text.setAttribute('class', 'edge-label');
    text.setAttribute('x', (e.a.px + e.b.px) / 2 + 6);
    text.setAttribute('y', (e.a.py + e.b.py) / 2);
    text.textContent = e.label || '';
  });

  const wrapKey = L.work.map((n) => n.id).join('|');
  let holder = stage.querySelector('.tree-nodes');
  if (!holder){
    holder = document.createElement('div');
    holder.className = 'tree-nodes';
    stage.appendChild(holder);
  }
  if (keyed(holder, wrapKey)){
    L.work.forEach(() => {
      const d = document.createElement('div');
      d.className = 'node';
      d.innerHTML = '<span class="v"></span><span class="sub"></span>';
      holder.appendChild(d);
    });
  }
  L.work.forEach((n, i) => {
    const el = holder.children[i];
    el.className = 'node ' + (n.cls || '') + (n.nil ? ' nil' : '') + (p.square ? ' square' : '');
    el.style.left = n.px + 'px';
    el.style.top = n.py + 'px';
    el.querySelector('.v').textContent = n.nil ? '∅' : String(n.v);
    const sub = el.querySelector('.sub');
    sub.textContent = n.sub || '';
    sub.style.display = n.sub ? '' : 'none';
  });

  // Named markers - root, cur, lca - floating just above their node.
  const tags = (p.tags || []).filter((t) => L.byId.has(String(t.id)));
  let tagHolder = stage.querySelector('.tree-tags');
  if (!tagHolder){
    tagHolder = document.createElement('div');
    tagHolder.className = 'tree-tags';
    stage.appendChild(tagHolder);
  }
  if (keyed(tagHolder, tags.map((t) => t.name).join('|'))){
    tags.forEach(() => tagHolder.appendChild(document.createElement('div')));
  }
  tags.forEach((t, i) => {
    const el = tagHolder.children[i];
    const n = L.byId.get(String(t.id));
    el.className = 'node-tag ' + (t.cls || '');
    el.textContent = t.name;
    el.style.left = n.px + 'px';
    el.style.top = (n.py - 38 * k) + 'px';
  });
}

/* --- tree: a real tree, with edges --- */
RENDER.tree = function(body, p){
  const k = pscale(p);
  let scroll = body.querySelector('.tree-scroll');
  if (!scroll){
    body.innerHTML = '<div class="tree-scroll"><div class="tree-stage"></div></div>';
    scroll = body.querySelector('.tree-scroll');
  }
  const stage = scroll.querySelector('.tree-stage');
  if (!p.nodes || !p.nodes.length){
    stage.style.width = ''; stage.style.height = '';
    stage.innerHTML = '<span class="chips-empty">' + esc(p.empty || 'empty tree') + '</span>';
    delete stage.dataset.built;
    return;
  }
  if (!stage.dataset.built){ stage.innerHTML = ''; stage.dataset.built = '1'; }
  drawTree(stage, p.nodes, p, k);
};

/* --- list: boxes joined by arrows, the way a linked list is drawn by hand --- */
RENDER.list = function(body, p, animate){
  const k = pscale(p);
  const rows = p.rows || [];
  let els = [...body.querySelectorAll('.list-row-wrap')];
  if (els.length !== rows.length){
    body.innerHTML = rows.map(() =>
      '<div class="list-row-wrap"><div class="list-label"></div>' +
      '<div class="list-scroll"><div class="list-row"><svg class="list-cycle"></svg></div></div></div>').join('');
    els = [...body.querySelectorAll('.list-row-wrap')];
  }
  rows.forEach((r, ri) => {
    const wrap = els[ri];
    const label = wrap.querySelector('.list-label');
    label.textContent = r.label || '';
    label.style.display = r.label ? '' : 'none';
    const row = wrap.querySelector('.list-row');
    const svg = row.querySelector('.list-cycle');
    const nodes = r.nodes || [];

    // One cell per node, an arrow between each pair, and a terminator.
    const key = nodes.map((n) => String(n.id !== undefined ? n.id : n.v)).join('|') + '#' + (r.tail || '');
    let cells = [...row.querySelectorAll('.list-cell')];
    if (row.dataset.key !== key){
      row.dataset.key = key;
      [...row.querySelectorAll('.list-cell,.list-arrow,.list-null,.chips-empty')].forEach((n) => n.remove());
      nodes.forEach((n, i) => {
        const c = document.createElement('div');
        c.className = 'list-cell';
        c.innerHTML = '<span class="v"></span><span class="sub"></span>';
        row.appendChild(c);
        if (i < nodes.length - 1 || r.tail){
          const a = document.createElement('span');
          a.className = 'list-arrow';
          a.textContent = '→';
          row.appendChild(a);
        }
      });
      if (r.tail){
        const t = document.createElement('span');
        t.className = 'list-null';
        t.textContent = r.tail === true ? '∅' : String(r.tail);
        row.appendChild(t);
      }
      if (!nodes.length){
        const e = document.createElement('span');
        e.className = 'chips-empty';
        e.textContent = r.empty || 'empty';
        row.appendChild(e);
      }
      cells = [...row.querySelectorAll('.list-cell')];
    }

    nodes.forEach((n, i) => {
      const c = cells[i];
      c.className = 'list-cell ' + (n.cls || '') + (animate && n.fresh ? ' fresh' : '');
      c.querySelector('.v').textContent = String(n.v);
      const sub = c.querySelector('.sub');
      sub.textContent = n.sub || '';
      sub.style.display = n.sub ? '' : 'none';
    });
    // An arrow is a pointer. Reversal problems live or die on being able to see
    // one go dashed or vanish, so arrows take their own classes.
    const arrows = [...row.querySelectorAll('.list-arrow')];
    arrows.forEach((a, i) => {
      const spec = (r.arrows || [])[i];
      const cls = typeof spec === 'string' ? spec : (spec && spec.cls) || '';
      a.className = 'list-arrow ' + cls;
      a.textContent = (spec && spec.text) || (cls.indexOf('back') >= 0 ? '←' : '→');
    });

    // Markers, placed against real measured geometry rather than guessed at.
    const tags = (r.tags || []).filter((t) => t.idx === undefined || cells[t.idx]);
    let marks = [...row.querySelectorAll('.list-tag')];
    if (marks.length !== tags.length){
      marks.forEach((m) => m.remove());
      tags.forEach(() => {
        const m = document.createElement('span');
        m.className = 'list-tag';
        row.appendChild(m);
      });
      marks = [...row.querySelectorAll('.list-tag')];
    }
    const seen = {};
    tags.forEach((t, i) => {
      const m = marks[i];
      m.textContent = t.name;
      const cell = cells[t.idx];
      const below = !!t.below;
      if (!cell || t.idx < 0 || t.idx === undefined){
        m.className = 'list-tag ' + (t.cls || '') + (below ? ' below' : ' above');
        return;
      }
      m.className = 'list-tag visible ' + (t.cls || '') + (below ? ' below' : ' above');
      const bucket = (below ? 'b' : 'a') + t.idx;
      const n = (seen[bucket] = (seen[bucket] || 0) + 1);
      const nudge = n === 1 ? 0 : (n === 2 ? 18 * k : -18 * k);
      m.style.left = (cell.offsetLeft + cell.offsetWidth / 2 + nudge) + 'px';
    });

    // The back-edge that makes a cycle a cycle.
    const to = r.cycleTo;
    const from = cells.length - 1;
    if (to !== undefined && to !== null && cells[to] && cells[from]){
      const a = cells[from], b = cells[to];
      const ax = a.offsetLeft + a.offsetWidth / 2, bx = b.offsetLeft + b.offsetWidth / 2;
      const y = a.offsetTop + a.offsetHeight;
      const dip = y + 26 * k;
      svg.style.display = '';
      svg.setAttribute('viewBox', '0 0 ' + row.scrollWidth + ' ' + row.scrollHeight);
      svg.setAttribute('width', row.scrollWidth);
      svg.setAttribute('height', row.scrollHeight);
      if (keyed(svg, 'cyc')) svg.appendChild(mkSvg('path'));
      svg.firstChild.setAttribute('d',
        'M ' + ax + ' ' + y + ' C ' + ax + ' ' + dip + ', ' + bx + ' ' + dip + ', ' + bx + ' ' + y);
    } else {
      svg.style.display = 'none';
    }
  });
};

/* --- stack / queue: a bucket with a floor and an open top --- */
RENDER.stack = function(body, p, animate){
  const buckets = p.buckets || [];
  let box = body.querySelector('.buckets');
  if (!box){ body.innerHTML = '<div class="buckets"></div>'; box = body.querySelector('.buckets'); }
  let els = [...box.children];
  if (els.length !== buckets.length){
    box.innerHTML = buckets.map(() =>
      '<div class="bucket"><span class="bucket-label"></span>' +
      '<div class="bucket-box"><span class="bucket-empty"></span></div>' +
      '<span class="bucket-foot"></span></div>').join('');
    els = [...box.children];
  }
  buckets.forEach((b, bi) => {
    const el = els[bi];
    const queue = b.mode === 'queue';
    el.className = 'bucket' + (queue ? ' queue' : '');
    const label = el.querySelector('.bucket-label');
    label.textContent = b.label || '';
    label.style.display = b.label ? '' : 'none';
    const foot = el.querySelector('.bucket-foot');
    foot.textContent = b.foot || '';
    foot.style.display = b.foot ? '' : 'none';

    const inner = el.querySelector('.bucket-box');
    const items = b.items || [];
    let cells = [...inner.querySelectorAll('.cell')];
    let top = inner.querySelector('.bucket-top');
    if (cells.length !== items.length){
      cells.forEach((c) => c.remove());
      if (top){ top.remove(); top = null; }   // re-appended below, so it stays last
      items.forEach(() => {
        const c = document.createElement('div');
        c.className = 'cell';
        inner.appendChild(c);
      });
      cells = [...inner.querySelectorAll('.cell')];
    }
    // Outside the rebuild, not inside it: a bucket that starts empty and stays
    // empty never enters that branch, and step -1 empties every bucket. Created
    // in there, the marker did not exist on the first frame of every stack
    // panel in the repo, and the whole page died on the first render.
    if (!top){
      top = document.createElement('span');
      top.className = 'bucket-top';
      inner.appendChild(top);          // last child: column-reverse puts it on top
    }
    items.forEach((it, i) => {
      const c = cells[i];
      c.className = 'cell ' + (it.cls || '') +
                    (animate && it.fresh ? ' fresh' : '') + (animate && it.popped ? ' popped' : '');
      c.innerHTML = esc(String(it.text)) + (it.sub ? ' <small>' + esc(it.sub) + '</small>' : '');
    });
    const empty = el.querySelector('.bucket-empty');
    empty.textContent = b.empty || 'empty';
    empty.style.display = items.length ? 'none' : '';
    top.textContent = items.length ? (b.top || (queue ? '' : '← top')) : '';
    top.style.display = top.textContent ? '' : 'none';
  });
};

/* --- grid: a matrix, drawn as a matrix --- */
RENDER.grid = function(body, p, animate){
  const k = pscale(p);
  const rows = p.rows || [];
  const colLabels = p.colLabels, rowLabels = p.rowLabels;
  let stage = body.querySelector('.grid-stage');
  if (!stage){
    body.innerHTML = '<div class="grid-scroll"><div class="grid-stage"><table class="grid-tbl"></table>' +
                     '<div class="grid-box"></div></div></div>';
    stage = body.querySelector('.grid-stage');
  }
  const tbl = stage.querySelector('.grid-tbl');
  const width = Math.max(0, ...rows.map((r) => r.length));
  const key = rows.length + 'x' + width + (colLabels ? '#c' : '') + (rowLabels ? '#r' : '');
  if (keyed(tbl, key)){
    let html = '';
    if (colLabels){
      html += '<tr>' + (rowLabels ? '<th></th>' : '') +
              colLabels.slice(0, width).map((c) => '<th>' + esc(String(c)) + '</th>').join('') + '</tr>';
    }
    for (let r = 0; r < rows.length; r++){
      html += '<tr>' + (rowLabels ? '<th>' + esc(String(rowLabels[r] !== undefined ? rowLabels[r] : r)) + '</th>' : '');
      for (let c = 0; c < width; c++) html += '<td class="grid-cell"><span class="v"></span><span class="sub"></span></td>';
      html += '</tr>';
    }
    tbl.innerHTML = html;
  }
  const cells = [...tbl.querySelectorAll('.grid-cell')];
  const at = (r, c) => cells[r * width + c];
  rows.forEach((row, r) => {
    for (let c = 0; c < width; c++){
      const el = at(r, c);
      if (!el) continue;
      const raw = row[c];
      const it = (raw !== null && typeof raw === 'object') ? raw : {v: raw};
      const missing = it.v === undefined || it.v === null;
      el.className = 'grid-cell ' + (it.cls || '') + (missing ? ' ghost' : '') +
                     (animate && it.fresh ? ' fresh' : '');
      el.querySelector('.v').textContent = missing ? '' : String(it.v);
      const sub = el.querySelector('.sub');
      sub.textContent = it.sub || '';
      sub.style.display = it.sub ? '' : 'none';
    }
  });

  // A bracket round a sub-rectangle: the search space that is still alive.
  const bx = stage.querySelector('.grid-box');
  const b = p.box;
  if (b && at(b.r0, b.c0) && at(b.r1, b.c1) && b.r0 <= b.r1 && b.c0 <= b.c1){
    const a = at(b.r0, b.c0), z = at(b.r1, b.c1);
    const pad = 5 * k;
    bx.className = 'grid-box visible' + (b.dashed ? ' dashed' : '');
    bx.style.left = (a.offsetLeft - pad) + 'px';
    bx.style.top = (a.offsetTop - pad) + 'px';
    bx.style.width = (z.offsetLeft + z.offsetWidth - a.offsetLeft + pad * 2) + 'px';
    bx.style.height = (z.offsetTop + z.offsetHeight - a.offsetTop + pad * 2) + 'px';
  } else {
    bx.className = 'grid-box';
  }
};

/* --- heap: the tree and the array that stores it, side by side ---
   A heap is the one structure where both views are needed at once: the
   sift path only makes sense as a tree, and the index arithmetic only
   makes sense as an array. Showing one without the other is how a heap
   animation ends up teaching nothing. */
RENDER.heap = function(body, p, animate){
  const k = pscale(p);
  const items = (p.items || []).map((it) => (it !== null && typeof it === 'object' ? it : {v: it}));
  let wrap = body.querySelector('.heap-wrap');
  if (!wrap){
    body.innerHTML = '<div class="heap-wrap"><div class="tree-scroll"><div class="tree-stage"></div></div>' +
                     '<span class="heap-caption"></span><div class="heap-array"></div></div>';
    wrap = body.querySelector('.heap-wrap');
  }
  const stage = wrap.querySelector('.tree-stage');
  const cap = wrap.querySelector('.heap-caption');
  const arr = wrap.querySelector('.heap-array');

  if (!items.length){
    stage.style.width = ''; stage.style.height = '';
    stage.innerHTML = '<span class="chips-empty">' + esc(p.empty || 'empty heap') + '</span>';
    delete stage.dataset.built;
  } else {
    if (!stage.dataset.built){ stage.innerHTML = ''; stage.dataset.built = '1'; }
    const nodes = items.map((it, i) => ({
      id: 'h' + i, v: it.v, parent: i ? 'h' + ((i - 1) >> 1) : null,
      side: i % 2 ? 'L' : 'R', cls: it.cls || '', sub: it.sub, edgeCls: it.edgeCls || '',
    }));
    drawTree(stage, nodes, {
      tags: (p.tags || []).map((t) => ({name: t.name, id: 'h' + t.idx, cls: t.cls})),
      links: p.links,
    }, k);
  }

  cap.textContent = p.caption || 'stored as an array — index i has children 2i+1 and 2i+2';
  cap.style.display = p.showArray === false ? 'none' : '';

  if (p.showArray === false){ arr.style.display = 'none'; return; }
  arr.style.display = '';
  let slots = [...arr.children];
  if (slots.length !== items.length){
    arr.innerHTML = items.map(() => '<div class="heap-slot"><span class="idx"></span><span class="v"></span></div>').join('');
    slots = [...arr.children];
  }
  items.forEach((it, i) => {
    const s = slots[i];
    s.className = 'heap-slot ' + (it.cls || '') + (animate && it.fresh ? ' fresh' : '');
    s.querySelector('.idx').textContent = i;
    s.querySelector('.v').textContent = String(it.v);
  });
};

/* ---------------- playback ---------------- */
function render(animate){
  if (animate === undefined) animate = true;
  $('progressLabel').textContent = Math.max(stepIndex + 1, 0) + ' / ' + steps.length;
  const codeLines = document.querySelectorAll('.code .line');
  if (stepIndex < 0){
    codeLines.forEach(l => l.classList.remove('active'));
    applyLayers([]);
    $('statusMsg').innerHTML = 'Press <kbd>Play</kbd> or step forward to begin.';
    renderPanels(sol.idle ? sol.idle() : (steps[0] ? blankPanels(steps[0].panels) : []), false);
    return;
  }
  const step = steps[stepIndex];
  const active = step.lines || [];
  codeLines.forEach(el => el.classList.toggle('active', active.indexOf(Number(el.dataset.line)) >= 0));
  applyLayers(active);
  $('statusMsg').innerHTML = step.msg;
  renderPanels(step.panels, animate);
}

// step -1 shows the first step's shape with all highlighting stripped
function blankPanels(panels){
  return JSON.parse(JSON.stringify(panels)).map(p => {
    if (p.t === 'tiles'){ p.items.forEach(i => { i.cls = ''; i.flash = false; }); p.bracket = null; p.ptrs = []; }
    if (p.t === 'bars'){ p.items.forEach(i => { i.cls = ''; }); p.fill = null; }
    if (p.t === 'ranges'){ p.items.forEach(i => { i.cls = 'ghost'; }); }
    if (p.t === 'chips'){ p.rows.forEach(r => { r.items = []; }); }
    if (p.t === 'slots'){ p.items.forEach(i => { i.text = ''; i.cls = ''; }); }
    if (p.t === 'pills'){ p.items.forEach(i => { i.v = '–'; }); }
    // A structure is shown in its starting state, not emptied: the whole point
    // of step -1 on a tree problem is seeing the tree you are about to walk.
    if (p.t === 'tree'){ p.nodes.forEach(n => { n.cls = ''; n.edgeCls = ''; }); p.tags = []; p.links = []; }
    if (p.t === 'list'){ p.rows.forEach(r => { (r.nodes || []).forEach(n => { n.cls = ''; n.fresh = false; }); r.tags = []; r.arrows = []; }); }
    if (p.t === 'stack'){ p.buckets.forEach(b => { b.items = []; }); }
    if (p.t === 'grid'){ p.rows.forEach(r => r.forEach(c => { if (c && typeof c === 'object'){ c.cls = ''; c.fresh = false; } })); p.box = null; }
    if (p.t === 'heap'){ p.items = []; p.tags = []; }
    return p;
  });
}

function stepForward(){ if (stepIndex >= steps.length - 1){ pause(); return; } stepIndex++; render(); if (stepIndex >= steps.length - 1) pause(); }
function stepBack(){ if (stepIndex <= -1) return; stepIndex--; render(); }
function resetAll(){ pause(); stepIndex = -1; render(false); }
function play(){ if (!steps.length) return; if (stepIndex >= steps.length - 1) stepIndex = -1; playing = true; $('playBtn').textContent = '❚❚'; tick(); }
function pause(){ playing = false; $('playBtn').textContent = '▶'; if (timer) clearTimeout(timer); }
/**
 * Run a transport action, and if it throws, stop and SAY SO.
 *
 * Without this, an exception inside render() kills the setTimeout chain while
 * `playing` stays true - so the button shows a pause icon, the step counter
 * freezes, and nothing anywhere indicates that anything went wrong. A visualizer
 * that has crashed then looks identical to one waiting for you to press play.
 */
function guard(fn){
  try { fn(); return true; }
  catch (err){
    playing = false;
    if (timer) clearTimeout(timer);
    $('playBtn').textContent = '▶';
    $('statusMsg').innerHTML = 'Playback stopped - this visualizer has a bug: <code>'
      + esc(String((err && err.message) || err)) + '</code>';
    return false;
  }
}

function tick(){
  if (!playing) return;
  if (!guard(stepForward)) return;
  if (stepIndex >= steps.length - 1){ pause(); return; }
  const s = $('speedInput');
  timer = setTimeout(tick, (Number(s.min) + Number(s.max)) - Number(s.value));
}

function rebuild(){
  const parsed = PROBLEM.parse(readRaw());
  if (!parsed.ok){
    pause(); steps = []; stepIndex = -1;
    host().innerHTML = '';
    $('statusMsg').innerHTML = parsed.msg;
    $('progressLabel').textContent = '0 / 0';
    return;
  }
  if (parsed.normalized) writeBack(parsed.normalized);
  steps = sol.simulate(parsed.value);
  stepIndex = -1;
  pause();
  host().innerHTML = '';
  requestAnimationFrame(() => { render(false); requestAnimationFrame(() => render(false)); });
}

$('playBtn').addEventListener('click', () => playing ? pause() : play());
$('fwdBtn').addEventListener('click', () => { pause(); guard(stepForward); });
$('backBtn').addEventListener('click', () => { pause(); guard(stepBack); });
$('resetBtn').addEventListener('click', resetAll);
$('codeToggle').addEventListener('click', () => {
  showAll = !showAll;
  const b = $('codeToggle');
  b.textContent = showAll ? 'show one method' : 'show all';
  b.setAttribute('aria-pressed', String(showAll));
  applyLayers(lastActive);
});
// Re-lock on resize: the cap is a fraction of the viewport, so a window that
// changed shape leaves the panel measured against a screen that is gone.
addEventListener('resize', () => { if (sol && sol.__layers && sol.__layers.length){ lockHeight(); applyLayers(lastActive); } });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, button')) return;
  if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); pause(); stepForward(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); pause(); stepBack(); }
  else if (e.key === 'r' || e.key === 'R'){ resetAll(); }
});
window.addEventListener('resize', () => render(false));

buildHeader();
buildTabs();
loadSolution();
rebuild();
})();
</script>
