<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Window Maximum — visualizer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Courier+Prime:wght@400;700&display=swap');

/* "Lemonade & Sweet Tea" (Designing Digitals) is a paid font, so it can't be bundled here.
   If it's installed on your machine, local() below picks it up automatically. */
@font-face{
  font-family:'Lemonade Sweet Tea';
  src: local('Lemonade & Sweet Tea'), local('Lemonade Sweet Tea'), local('LemonadeSweetTea');
  font-display: swap;
}

:root{
  --paper:#FBF5E9;
  --ink:#211E1A;
  --pencil:#8A8175;
  --pencil-light:#C9C0AF;
  --orange:#F5A93F;
  --orange-soft:#FBE3BC;
  --red:#C94F2E;
  --green:#5E8C61;
  --tile:72px;
  --hand:'Lemonade Sweet Tea','Patrick Hand',cursive;
  --mono:'Courier Prime', ui-monospace, 'Courier New', monospace;
  --sk-lg:255px 18px 225px 18px / 18px 225px 18px 255px;
  --sk-md:14px 8px 12px 10px / 10px 12px 8px 14px;
  --sk-sm:8px 5px 9px 6px / 6px 9px 5px 8px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--hand);
  min-height:100vh;
  padding:32px clamp(18px, 3vw, 56px) 48px;
}
.app{width:100%;max-width:1760px;margin:0 auto;}

/* ---------- header ---------- */
.topbar{
  display:flex; flex-wrap:wrap; gap:24px 40px;
  justify-content:space-between; align-items:flex-end;
  margin-bottom:18px; padding-bottom:18px;
  border-bottom:2px solid var(--ink);
}
.brand-note{font-size:16px;color:var(--pencil);margin:0 0 2px;transform:rotate(-1.2deg);transform-origin:left bottom;}
.brand-title{font-family:var(--hand);font-size:clamp(30px, 3.2vw, 42px);font-weight:700;line-height:1;margin:0 0 8px;}
.brand-sub{font-size:16px;line-height:1.45;color:var(--ink);margin:0;max-width:min(112ch, 100%);}
.brand-sub code, .status code, .note-text code{
  font-family:var(--mono);font-size:13px;background:var(--orange-soft);padding:0 4px;border-radius:var(--sk-sm);
}
.brand-sub b{font-weight:700;}

.config{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;}
.field{display:flex;flex-direction:column;gap:2px;}
.field span{font-size:14px;color:var(--pencil);line-height:1;}
.field input{
  font-family:var(--mono);font-size:14px;background:var(--paper);
  border:2px solid var(--ink);border-radius:var(--sk-md);color:var(--ink);padding:9px 12px;
}
.field input:focus-visible, button:focus-visible, input[type=range]:focus-visible{
  outline:3px solid var(--orange);outline-offset:2px;
}
button{
  font-family:var(--hand);font-weight:700;font-size:15px;line-height:1;cursor:pointer;
  border:2px solid var(--ink);border-radius:var(--sk-md);background:var(--paper);color:var(--ink);
  padding:9px 16px 11px;transition:transform .1s ease, background .15s ease;
}
button:hover{background:var(--orange-soft);}
button:active{transform:translate(1px,1px);}
button.primary{background:var(--orange);}
button.primary:hover{background:#F7B85F;}

/* ---------- solution tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.tab{
  display:flex;flex-direction:column;align-items:flex-start;gap:3px;
  padding:9px 18px 11px;text-align:left;background:var(--paper);
}
.tab b{font-size:17px;font-weight:700;line-height:1.1;}
.tab span{font-family:var(--mono);font-size:11px;color:var(--pencil);line-height:1.1;}
.tab.active{background:var(--orange);box-shadow:3px 3px 0 var(--ink);}
.tab.active span{color:var(--ink);}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:16px;color:var(--pencil);margin-bottom:18px;}
.legend span{display:inline-flex;align-items:center;gap:9px;}
.swatch{width:15px;height:15px;border:2px solid var(--ink);border-radius:var(--sk-sm);display:inline-block;background:var(--paper);}
.swatch.win{background:var(--orange-soft);}
.swatch.hot{background:var(--orange);}
.swatch.done{background:var(--ink);}
.swatch.good{background:var(--green);}
.swatch.dim{opacity:.42;}
.swatch.rem{background:var(--paper);border-color:var(--red);position:relative;}
.swatch.rem::after{content:'✕';position:absolute;inset:0;color:var(--red);font-size:11px;line-height:14px;text-align:center;font-family:var(--hand);}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0, 1.25fr) minmax(430px, 1fr);gap:20px;align-items:start;}
.col-left{display:flex;flex-direction:column;gap:20px;min-width:0;}
@media (max-width: 1200px){ .stage{grid-template-columns:1fr;} }

.panel{background:var(--paper);border:2px solid var(--ink);border-radius:var(--sk-lg);padding:22px 24px;}
.panel-title{font-size:21px;font-weight:600;margin:0 0 16px;transform:rotate(-0.6deg);transform-origin:left center;}

/* ---------- tiles ---------- */
.array-scroll{overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;}
.array-row{position:relative;display:flex;gap:12px;padding-top:12px;padding-bottom:46px;width:max-content;}
.array-row.no-ptrs{padding-bottom:8px;}
.tile{
  min-width:var(--tile);height:var(--tile);padding:0 6px;
  border:2px solid var(--ink);border-radius:var(--sk-md);background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  transition:background .25s ease, border-color .25s ease, transform .2s ease, color .25s ease;
}
.tile .idx{position:absolute;top:4px;right:8px;font-size:12px;line-height:1;color:var(--pencil);}
.tile .val{font-size:24px;font-weight:700;margin-top:6px;white-space:nowrap;}
.tile .sub{font-size:12px;line-height:1;color:var(--pencil);margin-top:2px;}
.tile.narrow{min-width:56px;}
.tile.in-window{background:var(--orange-soft);}
.tile.hot{background:var(--orange);}
.tile.good{background:var(--green);color:var(--paper);}
.tile.good .idx,.tile.good .sub{color:var(--paper);}
.tile.dim{opacity:.42;}
.tile.done{background:var(--ink);color:var(--paper);}
.tile.done .idx,.tile.done .sub{color:var(--pencil-light);}
.tile.is-current{transform:translateY(-3px);box-shadow:3px 3px 0 var(--ink);}
.tile.just-popped{animation:pop-fade .55s ease;}
.tile.just-popped::after{
  content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:42px;color:var(--red);animation:x-fade .55s ease forwards;
}
@keyframes pop-fade{0%{border-color:var(--red);transform:scale(1.06);}100%{border-color:var(--ink);}}
@keyframes x-fade{0%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}

.window-bracket{
  position:absolute;top:2px;height:calc(var(--tile) + 16px);
  border:2px solid var(--ink);border-radius:var(--sk-lg);pointer-events:none;
  transition:left .3s ease, width .3s ease, opacity .2s ease;opacity:0;
}
.window-bracket.visible{opacity:1;}
.window-bracket.dashed{border-style:dashed;border-color:var(--pencil);}

.ptr-marker{
  position:absolute;bottom:0;transform:translateX(-50%);
  font-size:19px;font-weight:700;line-height:1;text-align:center;pointer-events:none;
  transition:left .3s ease, opacity .2s ease;opacity:0;white-space:nowrap;
}
.ptr-marker.visible{opacity:1;}
.ptr-marker::before{content:'↑';display:block;font-size:15px;line-height:1;}
.ptr-marker.accent{color:var(--orange);text-shadow:0.5px 0 var(--ink);}
.ptr-marker.accent::before{color:var(--orange);}
.ptr-marker.red{color:var(--red);}
.ptr-marker.red::before{color:var(--red);}

/* ---------- chip rows ---------- */
.chip-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.chip-row + .chip-row{margin-top:12px;padding-top:12px;border-top:2px dashed var(--pencil-light);}
.row-label{font-size:16px;color:var(--pencil);white-space:nowrap;}
.chips{display:flex;gap:9px;flex-wrap:wrap;min-height:44px;align-items:center;}
.chip{
  font-size:18px;font-weight:600;line-height:1;background:var(--paper);
  border:2px solid var(--ink);border-radius:var(--sk-sm);padding:7px 11px 9px;white-space:nowrap;
  transition:background .25s ease, color .25s ease;
}
.chip small{font-family:var(--mono);font-size:11px;color:var(--pencil);}
.chip.head{background:var(--orange);}
.chip.head small{color:var(--ink);}
.chip.good{background:var(--green);color:var(--paper);}
.chip.good small{color:var(--paper);}
.chip.done{background:var(--ink);color:var(--paper);}
.chip.done small{color:var(--pencil-light);}
.chip.ghost{border-style:dashed;border-color:var(--pencil-light);color:var(--pencil-light);}
.chip.fresh{animation:fill-flash .5s ease;}
.chips-empty{font-size:16px;color:var(--pencil);}

/* ---------- slots (result row) ---------- */
.slot-row{display:flex;gap:10px;flex-wrap:wrap;}
.slot{
  min-width:58px;height:58px;padding:0 8px;border:2px dashed var(--pencil-light);border-radius:var(--sk-md);
  background:var(--paper);display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:700;color:var(--pencil-light);white-space:nowrap;
  transition:background .3s ease, color .3s ease, border-color .3s;
}
.slot.filled{background:var(--ink);border:2px solid var(--ink);color:var(--paper);}
.slot.fresh{animation:fill-flash .5s ease;}
@keyframes fill-flash{0%{transform:scale(1.18) rotate(-3deg);}100%{transform:scale(1) rotate(0);}}

/* ---------- bars ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:230px;position:relative;padding-bottom:26px;}
.bar-wrap{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;min-width:34px;flex:1;}
.bar{
  width:100%;border:2px solid var(--ink);border-radius:var(--sk-sm);background:var(--paper);
  transition:height .3s ease, background .25s ease;
}
.bar-wrap.hot .bar{background:var(--orange);}
.bar-wrap.in-window .bar{background:var(--orange-soft);}
.bar-wrap.dim{opacity:.35;}
.bar-wrap .cap{font-size:14px;line-height:1;margin-bottom:4px;}
.bar-wrap .foot{position:absolute;bottom:-22px;font-size:12px;color:var(--pencil);line-height:1;}
.water{
  position:absolute;border:2px dashed var(--orange);background:rgba(245,169,63,.22);
  border-radius:var(--sk-sm);pointer-events:none;
  transition:left .3s ease, width .3s ease, height .3s ease, bottom .3s ease, opacity .2s;
}

/* ---------- ranges (intervals) ---------- */
.ranges{display:flex;flex-direction:column;gap:8px;}
.range-line{position:relative;height:34px;}
.range-bar{
  position:absolute;top:0;height:34px;border:2px solid var(--ink);border-radius:var(--sk-sm);
  background:var(--paper);display:flex;align-items:center;justify-content:center;
  font-size:15px;line-height:1;white-space:nowrap;
  transition:left .3s ease, width .3s ease, background .25s ease;
}
.range-bar.hot{background:var(--orange);}
.range-bar.done{background:var(--ink);color:var(--paper);}
.range-bar.dim{opacity:.4;}
.range-bar.ghost{border-style:dashed;color:var(--pencil);}

/* ---------- pills ---------- */
.pills{display:flex;gap:14px;flex-wrap:wrap;font-size:18px;}
.pill{display:inline-flex;align-items:baseline;gap:8px;padding:3px 16px 6px;border:2px solid var(--ink);border-radius:var(--sk-md);}
.pill b{font-size:20px;font-family:var(--mono);}
.pill.accent{background:var(--orange-soft);}
.pill.hot{background:var(--orange);}
.pill.good{background:var(--green);color:var(--paper);}
.note-text{font-size:17px;line-height:1.45;}

/* ---------- code panel ---------- */
.code{font-family:var(--mono);font-size:13.5px;line-height:1.7;margin:0;color:var(--pencil);white-space:pre;overflow-x:auto;}
.code .line{padding:1px 8px;border-radius:var(--sk-sm);}
.code .line.active{background:var(--orange-soft);color:var(--ink);font-weight:700;}
.status{margin-top:16px;padding-top:14px;border-top:2px dashed var(--pencil-light);font-size:19px;line-height:1.4;min-height:76px;}
.status kbd, .shortcut-note kbd{font-family:var(--mono);font-size:14px;border:2px solid var(--ink);border-radius:var(--sk-sm);padding:1px 7px;background:var(--paper);}

/* ---------- transport ---------- */
.transport{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding:16px 20px;border:2px solid var(--ink);border-radius:var(--sk-lg);}
.transport button{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-family:var(--mono);}
#playBtn{width:52px;height:52px;background:var(--orange);font-size:19px;}
.speed{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--pencil);margin-left:8px;}
.speed input{accent-color:var(--orange);}
.speed .hint{font-size:13px;}
.progress{margin-left:auto;font-size:17px;color:var(--pencil);}
.shortcut-note{width:100%;font-size:14px;color:var(--pencil);margin:2px 0 0;}
.shortcut-note kbd{font-size:11px;border:1.5px solid var(--pencil);padding:0 5px;}

@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <p class="brand-note" id="brandNote"></p>
      <h1 class="brand-title" id="brandTitle"></h1>
      <p class="brand-sub" id="brandSub"></p>
    </div>
    <form class="config" id="configForm"></form>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="legend" id="legend"></div>

  <div class="stage">
    <div class="col-left" id="colLeft"></div>
    <aside class="panel">
      <p class="panel-title">Algorithm</p>
      <pre class="code" id="codeBlock"></pre>
      <div class="status" id="statusMsg">Press <kbd>Play</kbd> or step forward to begin.</div>
    </aside>
  </div>

  <div class="transport">
    <button id="resetBtn" title="Reset" aria-label="Reset">⟲</button>
    <button id="backBtn" title="Step back" aria-label="Step back">◂</button>
    <button id="playBtn" title="Play / Pause" aria-label="Play or pause">▶</button>
    <button id="fwdBtn" title="Step forward" aria-label="Step forward">▸</button>
    <label class="speed">speed
      <span class="hint">slow</span>
      <input type="range" id="speedInput" min="150" max="1800" value="1250" step="50" aria-label="Playback speed, right is faster">
      <span class="hint">fast</span>
    </label>
    <div class="progress" id="progressLabel">0 / 0</div>
    <p class="shortcut-note">shortcuts: <kbd>space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> step · <kbd>R</kbd> reset</p>
  </div>
</div>
<script>
/* ---- panel constructors shared by every problem definition ---- */
function pTiles(title, values, decorate, extra){
  const items = values.map((v, i) => Object.assign({v: String(v)}, decorate ? (decorate(i, v) || {}) : {}));
  return Object.assign({t:'tiles', title: title, items: items}, extra || {});
}
function pChips(title, rows){ return {t:'chips', title: title, rows: rows}; }
function pSlots(title, items){ return {t:'slots', title: title, items: items}; }
function pPills(title, items){ return {t:'pills', title: title, items: items}; }
function pBars(title, values, decorate, extra){
  const items = values.map((v, i) => Object.assign({v: v}, decorate ? (decorate(i, v) || {}) : {}));
  return Object.assign({t:'bars', title: title, items: items}, extra || {});
}
function pRanges(title, items, min, max){ return {t:'ranges', title: title, items: items, min: min, max: max}; }
function pNote(title, html){ return {t:'note', title: title, html: html}; }
function mapChips(map, hot){
  return Object.keys(map).map(k => ({text: k, sub: String(map[k]), cls: (k === hot ? 'head' : '')}));
}
/* ---- input parsing ---- */
function parseInts(raw, cap){
  const parts = String(raw).split(',').map(s => s.trim()).filter(s => s.length);
  if (!parts.length) return null;
  const nums = parts.map(Number);
  if (nums.some(n => !Number.isFinite(n))) return null;
  return cap ? nums.slice(0, cap) : nums;
}
function randInts(n, lo, hi){
  return Array.from({length: n}, () => lo + Math.floor(Math.random() * (hi - lo + 1)));
}
function randWord(len, alphabet){
  const a = alphabet || 'abc';
  return Array.from({length: len}, () => a[Math.floor(Math.random() * a.length)]).join('');
}

const PROBLEM = {
  title: 'Sliding Window Maximum',
  note: 'a max is not invertible — so keep the live candidates, not one number',
  inputs: [
    {id:'nums', label:'array', value:'1,3,-1,-3,5,3,6,7', width:260},
    {id:'k', label:'k', type:'number', value:3, width:70}
  ],
  parse(raw){
    const nums = parseInts(raw.nums, 14);
    if (!nums) return {ok:false, msg:'Enter a valid comma-separated list of integers.'};
    let k = parseInt(raw.k, 10);
    k = Math.min(Math.max(isNaN(k) ? 1 : k, 1), nums.length);
    return {ok:true, value:{nums, k}, normalized:{nums: nums.join(','), k}};
  },
  shuffle(){
    const len = 8 + Math.floor(Math.random()*4);
    return {nums: randInts(len, -9, 9).join(','), k: 2 + Math.floor(Math.random()*Math.min(4, len-2))};
  },
  solutions: [
  {
    label: 'Rescan each window',
    badge: 'O(n·k) · not in repo · 10¹⁰ at the real limits',
    blurb: 'Slide the window and scan it for its maximum each time. Correct, and it re-reads k−1 elements it already looked at one step ago. At n = 10⁵ and k = 10⁵ that is <b>10¹⁰</b> comparisons.',
    legend: [
      {cls:'win', text:'the current window'},
      {cls:'hot', text:'element being read'},
      {cls:'good', text:'the max of this window'},
      {cls:'done', text:'result written'}
    ],
    code: [
      'int[] result = new int[n - k + 1];',
      'for (int i = 0; i + k <= n; i++) {',
      '    int max = int.MinValue;',
      '    for (int j = i; j < i + k; j++)      // rescan the whole window',
      '        max = Math.Max(max, nums[j]);',
      '    result[i] = max;',
      '}',
      'return result;'
    ],
    simulate(input){
      const nums = input.nums, k = input.k, n = nums.length, steps = [];
      const out = new Array(n - k + 1).fill(null);
      let reads = 0;
      const panels = (i, j, maxIdx) => [
        pTiles('Array', nums, (x) => ({
          cls: x === j ? 'hot is-current' : x === maxIdx ? 'good' : (i >= 0 && x >= i && x < i + k) ? 'win' : ''
        }), {focus:j, bracket: i >= 0 ? {from:i, to:i + k - 1} : null,
             ptrs: i >= 0 ? [{name:'i', idx:i, cls:'accent'}] : []}),
        pSlots('result', out.map(v => ({text: v === null ? '' : v}))),
        pPills('', [{k:'k', v:k, cls:'accent'}, {k:'element reads', v: reads, cls:'hot'}, {k:'n·k', v: (n - k + 1) * k}])
      ];
      steps.push({lines:[1], msg:'One output slot per window: <b>' + (n - k + 1) + '</b> of them.', panels: panels(-1, -1, -1)});
      for (let i = 0; i + k <= n; i++){
        let max = -Infinity, maxIdx = -1;
        for (let j = i; j < i + k; j++){
          reads++;
          if (nums[j] > max){ max = nums[j]; maxIdx = j; }
          steps.push({lines:[4,5], msg:'Read <code>nums[' + j + '] = ' + nums[j] + '</code>. Running max ' + max + '.' + (j > i ? ' This element was already read in the previous window — that is the waste.' : ''),
            panels: panels(i, j, maxIdx)});
        }
        out[i] = max;
        steps.push({lines:[6], msg:'Window <code>[' + i + ', ' + (i+k-1) + ']</code> max = <b>' + max + '</b>. Next window shares ' + (k-1) + ' element' + (k === 2 ? '' : 's') + ' with this one, and every one of them gets read again.',
          panels: panels(i, -1, maxIdx)});
      }
      steps.push({lines:[8], msg:'Done in <b>' + reads + '</b> element reads. The deque tabs do it in at most 2n = ' + (2*n) + '.', panels: panels(-1, -1, -1)});
      return steps;
    }
  },
  {
    label: 'Monotonic deque (index-based)',
    badge: 'O(n) amortised · O(k) space · optimal.cs',
    blurb: 'A running max survives <b>admission</b> but not <b>eviction</b> — when the maximum itself slides out there is no way to recover the runner-up. So keep the live candidates. Key fact: if <code>i &lt; j</code> and <code>nums[i] ≤ nums[j]</code>, index <b>i is dead forever</b>. Discard the dead and what remains is strictly decreasing.',
    legend: [
      {cls:'win', text:'inside the window'},
      {cls:'hot', text:'index held in the deque (a live candidate)'},
      {cls:'rem', text:'just removed — expired or dominated'},
      {cls:'done', text:'result written'}
    ],
    code: [
      'var deque = new LinkedList<int>();       // holds INDICES',
      '',
      'for (int i = 0; i < n; i++) {',
      '    while (deque.Count > 0 && deque.First!.Value < i - k + 1)',
      '        deque.RemoveFirst();            // 1. expired',
      '',
      '    while (deque.Count > 0 && nums[deque.Last!.Value] < nums[i])',
      '        deque.RemoveLast();             // 2. dominated',
      '',
      '    deque.AddLast(i);',
      '',
      '    if (i >= k - 1)',
      '        result[i - k + 1] = nums[deque.First!.Value];',
      '}'
    ],
    simulate(input){
      const nums = input.nums, k = input.k, n = nums.length, steps = [];
      const out = new Array(n - k + 1).fill(null);
      const dq = [];
      const panels = (i, popped) => {
        const lo = Math.max(0, i - k + 1);
        return [
          pTiles('Array', nums, (x) => ({
            cls: x === popped ? 'is-current' : dq.indexOf(x) >= 0 ? 'hot' : (i >= 0 && x >= lo && x <= i) ? 'win' : '',
            flash: x === popped
          }), {focus:i, bracket: i >= 0 ? {from:lo, to:i, dashed: i < k - 1} : null,
               ptrs: i >= 0 ? [{name:'i', idx:i, cls:'accent'}] : []}),
          pChips('Deque of indices — values strictly decreasing front to back', [{
            left:'front →', right:'← back',
            items: dq.map((idx, p) => ({text: String(idx), sub: 'v=' + nums[idx], cls: p === 0 ? 'head' : ''})),
            empty:'empty'
          }]),
          pSlots('result', out.map(v => ({text: v === null ? '' : v}))),
          pPills('', [
            {k:'window max', v: dq.length ? nums[dq[0]] : '–', cls:'good'},
            {k:'deque size', v: dq.length, cls:'accent'},
            {k:'cap', v: k}
          ])
        ];
      };
      steps.push({lines:[1], msg:'The deque holds <b>indices</b>, not values. Storing values would lose the ability to test expiry — which is the whole reason indices are used.', panels: panels(-1, -1)});
      for (let i = 0; i < n; i++){
        steps.push({lines:[3], msg:'i = ' + i + ', value <b>' + nums[i] + '</b>. Window is now <code>[' + Math.max(0, i-k+1) + ', ' + i + ']</code>.', panels: panels(i, -1)});
        while (dq.length && dq[0] < i - k + 1){
          const gone = dq.shift();
          steps.push({lines:[4,5], msg:'Front index <b>' + gone + '</b> is older than ' + (i - k + 1) + ' — it has slid out of the window. Drop it from the <b>front</b>. Expire first, then dominate: reversed, an expired index could evict a live candidate before being discarded itself.',
            panels: panels(i, gone)});
        }
        while (dq.length && nums[dq[dq.length-1]] < nums[i]){
          const gone = dq.pop();
          steps.push({lines:[7,8], msg:'<code>nums[' + gone + '] = ' + nums[gone] + ' &lt; nums[' + i + '] = ' + nums[i] + '</code>. Every future window containing ' + gone + ' also contains ' + i + ' — newer, so it expires later — and ' + i + ' is larger. Index ' + gone + ' is <b>dead forever</b>. Drop it from the <b>back</b>.',
            panels: panels(i, gone)});
        }
        dq.push(i);
        steps.push({lines:[10], msg:'Push <b>' + i + '</b> at the back. The deque stays strictly decreasing, so its <b>front is the window maximum</b> by construction.', panels: panels(i, -1)});
        if (i >= k - 1){
          out[i - k + 1] = nums[dq[0]];
          steps.push({lines:[12,13], msg:'Window <code>[' + (i-k+1) + ', ' + i + ']</code> is full — its max is <code>nums[' + dq[0] + '] = <b>' + nums[dq[0]] + '</b></code>, read straight off the front in O(1).',
            panels: panels(i, -1)});
        } else {
          steps.push({lines:[12], msg:'Window still filling (needs ' + k + ' elements) — nothing to write yet.', panels: panels(i, -1)});
        }
      }
      steps.push({lines:[14], msg:'Result: <code>' + out.join(', ') + '</code>. Two nested <code>while</code> loops, still <b>O(n)</b>: each index is added exactly once and removed at most once across the entire run. Saying that out loud is the difference between memorising this and understanding it.',
        panels: panels(-1, -1)});
      return steps;
    }
  },
  {
    label: 'Same deque, explicit l / r',
    badge: 'O(n) · optimal-variant.cs · a restatement, not a new algorithm',
    blurb: 'Same algorithm, different framing — and the differences sit exactly where this problem is usually got wrong: <b>dominate → push → expire</b> instead of expire first, an <code>if</code> instead of a <code>while</code>, and <code>output[l]</code> with <code>l++</code> at write time.',
    legend: [
      {cls:'win', text:'inside the window [l, r]'},
      {cls:'hot', text:'index held in the deque'},
      {cls:'rem', text:'just removed'},
      {cls:'done', text:'result written'}
    ],
    code: [
      'var q = new LinkedList<int>();',
      'int l = 0, r = 0;',
      '',
      'while (r < n) {',
      '    while (q.Count > 0 && nums[q.Last.Value] < nums[r])',
      '        q.RemoveLast();          // dominate FIRST here',
      '    q.AddLast(r);',
      '',
      '    if (l > q.First.Value)',
      '        q.RemoveFirst();         // `if`, not `while`',
      '',
      '    if ((r + 1) >= k) {',
      '        output[l] = nums[q.First.Value];',
      '        l++;',
      '    }',
      '    r++;',
      '}'
    ],
    simulate(input){
      const nums = input.nums, k = input.k, n = nums.length, steps = [];
      const out = new Array(n - k + 1).fill(null);
      const q = [];
      let l = 0;
      const panels = (r, popped) => [
        pTiles('Array', nums, (x) => ({
          cls: x === popped ? 'is-current' : q.indexOf(x) >= 0 ? 'hot' : (r >= 0 && x >= l && x <= r) ? 'win' : '',
          flash: x === popped
        }), {focus:r, bracket: (r >= 0 && l <= r) ? {from:l, to:r, dashed: (r - l + 1) < k} : null,
             ptrs: r >= 0 ? [{name:'l', idx:l, cls:'accent'}, {name:'r', idx:r}] : []}),
        pChips('Deque of indices', [{
          left:'front →', right:'← back',
          items: q.map((idx, p) => ({text:String(idx), sub:'v=' + nums[idx], cls: p === 0 ? 'head' : ''})),
          empty:'empty'
        }]),
        pSlots('output — indexed by l, no arithmetic needed', out.map(v => ({text: v === null ? '' : v}))),
        pPills('', [{k:'l', v:l, cls:'accent'}, {k:'r', v: r < 0 ? '–' : r}, {k:'window max', v: q.length ? nums[q[0]] : '–', cls:'good'}])
      ];
      steps.push({lines:[1,2], msg:'Both edges tracked explicitly. <code>l</code> doubles as the index of the window whose answer is being written — which is why <code>output[l]</code> needs no arithmetic.', panels: panels(-1, -1)});
      for (let r = 0; r < n; r++){
        steps.push({lines:[4], msg:'r = ' + r + ', value <b>' + nums[r] + '</b>.', panels: panels(r, -1)});
        while (q.length && nums[q[q.length-1]] < nums[r]){
          const gone = q.pop();
          steps.push({lines:[5,6], msg:'<code>nums[' + gone + '] = ' + nums[gone] + ' &lt; ' + nums[r] + '</code> — dominated, drop from the back. Domination runs <b>before</b> expiry here, and that is still correct: the two operations touch <b>opposite ends</b> of the deque and cannot interfere.',
            panels: panels(r, gone)});
        }
        q.push(r);
        steps.push({lines:[7], msg:'Push <b>' + r + '</b> at the back.', panels: panels(r, -1)});
        if (l > q[0]){
          const gone = q.shift();
          steps.push({lines:[9,10], msg:'Front index <b>' + gone + '</b> is behind the left edge (l = ' + l + ') — drop it. A plain <code>if</code> suffices: <code>l</code> advances by at most one per iteration, so at most one index can newly go stale. Knowing <i>why</i> the weaker form works is the point; defaulting to <code>while</code> costs nothing.',
            panels: panels(r, gone)});
        }
        if (r + 1 >= k){
          out[l] = nums[q[0]];
          steps.push({lines:[12,13,14], msg:'Window <code>[' + l + ', ' + r + ']</code> is full — write <code>output[' + l + '] = ' + nums[q[0]] + '</code>, then <code>l++</code>. That <code>l++</code> lives <b>inside</b> this branch: moving it out would advance the left edge during the fill-up phase and corrupt every window after it.',
            panels: panels(r, -1)});
          l++;
        } else {
          steps.push({lines:[12], msg:'<code>(r + 1) &gt;= k</code> is false — the window holds ' + (r + 1) + ' of ' + k + ' elements. Nothing written, and <code>l</code> stays at 0.', panels: panels(r, -1)});
        }
      }
      steps.push({lines:[17], msg:'Result: <code>' + out.join(', ') + '</code> — identical to the other deque tab, same complexity, different bookkeeping. The <code>l</code>/<code>r</code> framing is worth adopting generally: it makes both edges first-class.',
        panels: panels(-1, -1)});
      return steps;
    }
  }]
};

/* ==========================================================================
   Shared visualizer engine.
   A problem file defines PROBLEM = { title, note, inputs, parse, shuffle,
   solutions:[{ label, badge, blurb, legend, code, simulate }] }.
   simulate(input) returns an array of steps:
     { lines:[1-based], msg:'html', panels:[ ...panel descriptors... ] }
   Panel descriptors are declarative; everything below is generic rendering.
   ========================================================================== */
(function(){
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let solIdx = 0, sol = null, steps = [], stepIndex = -1, playing = false, timer = null;

/* ---------------- header + config form ---------------- */
function buildHeader(){
  document.title = PROBLEM.title + ' — visualizer';
  $('brandTitle').textContent = PROBLEM.title;
  $('brandNote').textContent = PROBLEM.note || '';
  const f = $('configForm');
  f.innerHTML = '';
  PROBLEM.inputs.forEach(inp => {
    const d = document.createElement('div');
    d.className = 'field';
    d.innerHTML = '<span>' + esc(inp.label) + '</span>' +
      '<input id="in_' + inp.id + '" type="' + (inp.type || 'text') + '" value="' + esc(inp.value) +
      '" spellcheck="false" style="width:' + (inp.width || 210) + 'px" aria-label="' + esc(inp.label) + '">';
    f.appendChild(d);
  });
  const run = document.createElement('button');
  run.type = 'submit'; run.className = 'primary'; run.textContent = 'Run';
  f.appendChild(run);
  if (PROBLEM.shuffle){
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = 'Shuffle';
    b.addEventListener('click', () => {
      const vals = PROBLEM.shuffle();
      PROBLEM.inputs.forEach(i => { if (vals[i.id] !== undefined) $('in_' + i.id).value = vals[i.id]; });
      rebuild();
    });
    f.appendChild(b);
  }
  f.addEventListener('submit', e => { e.preventDefault(); rebuild(); });
}

function readRaw(){
  const o = {};
  PROBLEM.inputs.forEach(i => { o[i.id] = $('in_' + i.id).value; });
  return o;
}
function writeBack(vals){
  PROBLEM.inputs.forEach(i => { if (vals[i.id] !== undefined) $('in_' + i.id).value = vals[i.id]; });
}

/* ---------------- solution tabs ---------------- */
function buildTabs(){
  const t = $('tabs');
  t.innerHTML = '';
  PROBLEM.solutions.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (i === solIdx ? ' active' : '');
    b.innerHTML = '<b>' + esc(s.label) + '</b><span>' + esc(s.badge) + '</span>';
    b.addEventListener('click', () => { if (i === solIdx) return; solIdx = i; buildTabs(); loadSolution(); rebuild(); });
    t.appendChild(b);
  });
}

function loadSolution(){
  sol = PROBLEM.solutions[solIdx];
  $('brandSub').innerHTML = sol.blurb;
  $('legend').innerHTML = (sol.legend || []).map(l =>
    l.cls === null ? '<span>' + l.text + '</span>'
                   : '<span><i class="swatch ' + l.cls + '"></i> ' + l.text + '</span>').join('');
  $('codeBlock').innerHTML = sol.code.map((l, i) =>
    '<div class="line" data-line="' + (i + 1) + '">' + (l.length ? esc(l) : '&nbsp;') + '</div>').join('');
}

/* ---------------- panel rendering ---------------- */
const host = () => $('colLeft');

function panelShell(p){
  const el = document.createElement('div');
  el.className = 'panel';
  el.dataset.t = p.t;
  el.innerHTML = '<p class="panel-title"></p><div class="body"></div>';
  return el;
}

function renderPanels(panels, animate){
  const h = host();
  while (h.children.length > panels.length) h.removeChild(h.lastChild);
  panels.forEach((p, i) => {
    let el = h.children[i];
    if (!el || el.dataset.t !== p.t){
      const fresh = panelShell(p);
      if (el) h.replaceChild(fresh, el); else h.appendChild(fresh);
      el = fresh;
    }
    el.querySelector('.panel-title').innerHTML = p.title || '';
    el.querySelector('.panel-title').style.display = p.title ? '' : 'none';
    RENDER[p.t](el.querySelector('.body'), p, animate);
  });
}

const RENDER = {};

/* --- tiles: an array or string laid out as boxes, with optional bracket + pointers --- */
RENDER.tiles = function(body, p, animate){
  let scroll = body.querySelector('.array-scroll');
  if (!scroll){
    body.innerHTML = '<div class="array-scroll"><div class="array-row">' +
      '<div class="window-bracket"></div></div></div>';
    scroll = body.querySelector('.array-scroll');
  }
  const row = scroll.querySelector('.array-row');
  const bracket = row.querySelector('.window-bracket');
  const ptrs = p.ptrs || [];
  row.classList.toggle('no-ptrs', ptrs.length === 0);

  let tiles = [...row.querySelectorAll('.tile')];
  if (tiles.length !== p.items.length){
    tiles.forEach(t => t.remove());
    p.items.forEach(() => {
      const t = document.createElement('div');
      t.className = 'tile';
      t.innerHTML = '<span class="idx"></span><span class="val"></span><span class="sub"></span>';
      row.appendChild(t);
    });
    tiles = [...row.querySelectorAll('.tile')];
  }
  p.items.forEach((it, i) => {
    const t = tiles[i];
    t.className = 'tile ' + (it.cls || '') + (p.narrow ? ' narrow' : '') +
                  (animate && it.flash ? ' just-popped' : '');
    const idx = t.querySelector('.idx'), val = t.querySelector('.val'), sub = t.querySelector('.sub');
    const top = it.top !== undefined ? it.top : i;
    idx.textContent = top === '' ? '' : top;
    val.textContent = it.v;
    sub.textContent = it.sub || '';
    sub.style.display = it.sub ? '' : 'none';
  });

  // window bracket
  if (p.bracket && tiles[p.bracket.from] && tiles[p.bracket.to] && p.bracket.from <= p.bracket.to){
    const a = tiles[p.bracket.from], b = tiles[p.bracket.to];
    bracket.className = 'window-bracket visible' + (p.bracket.dashed ? ' dashed' : '');
    bracket.style.left = (a.offsetLeft - 4) + 'px';
    bracket.style.width = (b.offsetLeft + b.offsetWidth - a.offsetLeft + 8) + 'px';
  } else {
    bracket.className = 'window-bracket';
  }

  // pointer markers
  let marks = [...row.querySelectorAll('.ptr-marker')];
  if (marks.length !== ptrs.length){
    marks.forEach(m => m.remove());
    ptrs.forEach(() => {
      const m = document.createElement('div');
      m.className = 'ptr-marker';
      row.appendChild(m);
    });
    marks = [...row.querySelectorAll('.ptr-marker')];
  }
  const seen = {};
  ptrs.forEach((pt, i) => {
    const m = marks[i];
    m.textContent = pt.name;
    const tile = tiles[pt.idx];
    if (!tile || pt.idx < 0){ m.className = 'ptr-marker ' + (pt.cls || ''); return; }
    m.className = 'ptr-marker visible ' + (pt.cls || '');
    const n = (seen[pt.idx] = (seen[pt.idx] || 0) + 1);
    const nudge = n === 1 ? 0 : (n === 2 ? 20 : -20);
    m.style.left = (tile.offsetLeft + tile.offsetWidth / 2 + nudge) + 'px';
  });

  // keep the focused tile in view
  if (p.focus !== undefined && tiles[p.focus] && scroll.scrollWidth > scroll.clientWidth){
    const t = tiles[p.focus], left = t.offsetLeft, right = left + t.offsetWidth;
    if (left < scroll.scrollLeft + 12) scroll.scrollTo({left: Math.max(left - 24, 0), behavior:'smooth'});
    else if (right > scroll.scrollLeft + scroll.clientWidth - 12)
      scroll.scrollTo({left: right - scroll.clientWidth + 24, behavior:'smooth'});
  }
};

/* --- chips: one or more labelled rows of small boxes (deque, stack, map, heap) --- */
RENDER.chips = function(body, p, animate){
  const rows = p.rows;
  let els = [...body.querySelectorAll('.chip-row')];
  if (els.length !== rows.length){
    body.innerHTML = rows.map(() =>
      '<div class="chip-row"><span class="row-label left"></span><div class="chips"></div><span class="row-label right"></span></div>').join('');
    els = [...body.querySelectorAll('.chip-row')];
  }
  rows.forEach((r, i) => {
    const el = els[i];
    const L = el.querySelector('.left'), R = el.querySelector('.right'), box = el.querySelector('.chips');
    L.textContent = r.left || ''; L.style.display = r.left ? '' : 'none';
    R.textContent = r.right || ''; R.style.display = r.right ? '' : 'none';
    if (!r.items.length){
      box.innerHTML = '<span class="chips-empty">' + esc(r.empty || 'empty') + '</span>';
    } else {
      box.innerHTML = r.items.map(c =>
        '<span class="chip ' + (c.cls || '') + (animate && c.fresh ? ' fresh' : '') + '">' +
        esc(c.text) + (c.sub ? ' <small>' + esc(c.sub) + '</small>' : '') + '</span>').join('');
    }
  });
};

/* --- slots: the output array, dashes until written --- */
RENDER.slots = function(body, p, animate){
  let row = body.querySelector('.slot-row');
  if (!row){ body.innerHTML = '<div class="slot-row"></div>'; row = body.querySelector('.slot-row'); }
  let slots = [...row.children];
  if (slots.length !== p.items.length){
    row.innerHTML = p.items.map(() => '<div class="slot"></div>').join('');
    slots = [...row.children];
  }
  p.items.forEach((it, i) => {
    const s = slots[i];
    const wasFilled = s.classList.contains('filled');
    const filled = it.text !== null && it.text !== undefined && it.text !== '';
    s.textContent = filled ? it.text : '—';
    s.className = 'slot' + (filled ? ' filled' : '') + (it.cls ? ' ' + it.cls : '') +
                  (filled && !wasFilled && animate ? ' fresh' : '');
  });
};

/* --- pills: scalar readouts (l, r, sum, best...) --- */
RENDER.pills = function(body, p){
  let box = body.querySelector('.pills');
  if (!box){ body.innerHTML = '<div class="pills"></div>'; box = body.querySelector('.pills'); }
  box.innerHTML = p.items.map(it =>
    '<span class="pill ' + (it.cls || '') + '">' + esc(it.k) + ' = <b>' + esc(it.v) + '</b></span>').join('');
};

/* --- bars: a histogram, for height/price style problems --- */
RENDER.bars = function(body, p){
  let box = body.querySelector('.bars');
  if (!box){ body.innerHTML = '<div class="bars"><div class="water"></div></div>'; box = body.querySelector('.bars'); }
  const water = box.querySelector('.water');
  let wraps = [...box.querySelectorAll('.bar-wrap')];
  if (wraps.length !== p.items.length){
    wraps.forEach(w => w.remove());
    p.items.forEach(() => {
      const w = document.createElement('div');
      w.className = 'bar-wrap';
      w.innerHTML = '<span class="cap"></span><div class="bar"></div><span class="foot"></span>';
      box.appendChild(w);
    });
    wraps = [...box.querySelectorAll('.bar-wrap')];
  }
  const max = Math.max(1, ...p.items.map(i => Math.abs(i.v)));
  p.items.forEach((it, i) => {
    const w = wraps[i];
    w.className = 'bar-wrap ' + (it.cls || '');
    w.querySelector('.cap').textContent = it.v;
    w.querySelector('.foot').textContent = it.foot !== undefined ? it.foot : i;
    w.querySelector('.bar').style.height = Math.max(3, (Math.abs(it.v) / max) * 165) + 'px';
  });
  if (p.fill && wraps[p.fill.from] && wraps[p.fill.to]){
    const a = wraps[p.fill.from], b = wraps[p.fill.to];
    water.style.opacity = 1;
    water.style.left = (a.offsetLeft + a.offsetWidth * 0.5) + 'px';
    water.style.width = (b.offsetLeft + b.offsetWidth * 0.5 - a.offsetLeft - a.offsetWidth * 0.5) + 'px';
    water.style.bottom = '26px';
    water.style.height = Math.max(3, (p.fill.level / max) * 165) + 'px';
  } else {
    water.style.opacity = 0;
  }
};

/* --- ranges: intervals on a shared timeline --- */
RENDER.ranges = function(body, p){
  let box = body.querySelector('.ranges');
  if (!box){ body.innerHTML = '<div class="ranges"></div>'; box = body.querySelector('.ranges'); }
  let lines = [...box.children];
  if (lines.length !== p.items.length){
    box.innerHTML = p.items.map(() => '<div class="range-line"><div class="range-bar"></div></div>').join('');
    lines = [...box.children];
  }
  const lo = p.min, hi = Math.max(p.max, p.min + 1);
  p.items.forEach((it, i) => {
    const bar = lines[i].querySelector('.range-bar');
    bar.className = 'range-bar ' + (it.cls || '');
    bar.textContent = it.label;
    bar.style.left = ((it.from - lo) / (hi - lo) * 100) + '%';
    bar.style.width = 'max(72px, ' + ((it.to - it.from) / (hi - lo) * 100) + '%)';
  });
};

/* --- note: a free-text panel --- */
RENDER.note = function(body, p){
  let n = body.querySelector('.note-text');
  if (!n){ body.innerHTML = '<div class="note-text"></div>'; n = body.querySelector('.note-text'); }
  n.innerHTML = p.html;
};

/* ---------------- playback ---------------- */
function render(animate){
  if (animate === undefined) animate = true;
  $('progressLabel').textContent = Math.max(stepIndex + 1, 0) + ' / ' + steps.length;
  const codeLines = document.querySelectorAll('.code .line');
  if (stepIndex < 0){
    codeLines.forEach(l => l.classList.remove('active'));
    $('statusMsg').innerHTML = 'Press <kbd>Play</kbd> or step forward to begin.';
    renderPanels(sol.idle ? sol.idle() : (steps[0] ? blankPanels(steps[0].panels) : []), false);
    return;
  }
  const step = steps[stepIndex];
  const active = step.lines || [];
  codeLines.forEach(el => el.classList.toggle('active', active.indexOf(Number(el.dataset.line)) >= 0));
  $('statusMsg').innerHTML = step.msg;
  renderPanels(step.panels, animate);
}

// step -1 shows the first step's shape with all highlighting stripped
function blankPanels(panels){
  return JSON.parse(JSON.stringify(panels)).map(p => {
    if (p.t === 'tiles'){ p.items.forEach(i => { i.cls = ''; i.flash = false; }); p.bracket = null; p.ptrs = []; }
    if (p.t === 'bars'){ p.items.forEach(i => { i.cls = ''; }); p.fill = null; }
    if (p.t === 'ranges'){ p.items.forEach(i => { i.cls = 'ghost'; }); }
    if (p.t === 'chips'){ p.rows.forEach(r => { r.items = []; }); }
    if (p.t === 'slots'){ p.items.forEach(i => { i.text = ''; i.cls = ''; }); }
    if (p.t === 'pills'){ p.items.forEach(i => { i.v = '–'; }); }
    return p;
  });
}

function stepForward(){ if (stepIndex >= steps.length - 1){ pause(); return; } stepIndex++; render(); if (stepIndex >= steps.length - 1) pause(); }
function stepBack(){ if (stepIndex <= -1) return; stepIndex--; render(); }
function resetAll(){ pause(); stepIndex = -1; render(false); }
function play(){ if (!steps.length) return; if (stepIndex >= steps.length - 1) stepIndex = -1; playing = true; $('playBtn').textContent = '❚❚'; tick(); }
function pause(){ playing = false; $('playBtn').textContent = '▶'; if (timer) clearTimeout(timer); }
function tick(){
  if (!playing) return;
  stepForward();
  if (stepIndex >= steps.length - 1){ pause(); return; }
  const s = $('speedInput');
  timer = setTimeout(tick, (Number(s.min) + Number(s.max)) - Number(s.value));
}

function rebuild(){
  const parsed = PROBLEM.parse(readRaw());
  if (!parsed.ok){
    pause(); steps = []; stepIndex = -1;
    host().innerHTML = '';
    $('statusMsg').innerHTML = parsed.msg;
    $('progressLabel').textContent = '0 / 0';
    return;
  }
  if (parsed.normalized) writeBack(parsed.normalized);
  steps = sol.simulate(parsed.value);
  stepIndex = -1;
  pause();
  host().innerHTML = '';
  requestAnimationFrame(() => { render(false); requestAnimationFrame(() => render(false)); });
}

$('playBtn').addEventListener('click', () => playing ? pause() : play());
$('fwdBtn').addEventListener('click', () => { pause(); stepForward(); });
$('backBtn').addEventListener('click', () => { pause(); stepBack(); });
$('resetBtn').addEventListener('click', resetAll);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, button')) return;
  if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); pause(); stepForward(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); pause(); stepBack(); }
  else if (e.key === 'r' || e.key === 'R'){ resetAll(); }
});
window.addEventListener('resize', () => render(false));

buildHeader();
buildTabs();
loadSolution();
rebuild();
})();
</script>
</body>
</html>
