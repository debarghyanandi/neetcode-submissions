name: NeetCode pipeline

# ---------------------------------------------------------------------------
# MILESTONE 2 - detects, then writes the index and state, then commits.
#
# It still does NOT rename, delete, or edit your .cs files, and calls no model.
# Deciding which submission is the optimal one is a reading task; that is
# Milestone 3.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - '**/submission-*'
  schedule:
    # 20:30 UTC = 02:00 IST. GitHub's scheduler is best-effort; nothing here
    # is time-critical.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      exclude:
        description: 'Comma-separated slugs to hold back (empty = process everything)'
        required: false
        default: ''

concurrency:
  group: neetcode-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # LOOP GUARD 1 of 2: refuse to act on the pipeline's own commits.
    # LOOP GUARD 2 of 2: those commits are pushed with the built-in GITHUB_TOKEN,
    # whose pushes do not start new workflow runs. Swapping in a personal access
    # token defeats guard 2 - do not introduce one.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(pipeline)')

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # detect.mjs diffs against the pre-push SHA; a shallow clone cannot.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect pending submissions
        id: detect
        env:
          # Empty on cron and manual runs - which is what makes those drain
          # everything, including the folder a push would have held back.
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          MANUAL_EXCLUDE: ${{ github.event.inputs.exclude }}
        run: |
          set -euo pipefail
          args=()
          # Explicit ifs rather than `[ -n "$X" ] && args+=(...)`. Bash exempts a
          # failing left-hand side of an && list from set -e, so both forms work
          # here - but the && form returns non-zero, and if such a line ever ends
          # up last in a step it becomes the step's exit code. Not worth the trap.
          if [ -n "$BEFORE_SHA" ]; then
            args+=(--exclude-changed-since "$BEFORE_SHA")
          fi
          if [ -n "${MANUAL_EXCLUDE:-}" ]; then
            args+=(--exclude "$MANUAL_EXCLUDE")
          fi
          node scripts/detect.mjs "${args[@]}"
          node scripts/detect.mjs "${args[@]}" --json > "$RUNNER_TEMP/detect.json"

      - name: Apply - refresh index and state
        id: apply
        run: node scripts/apply.mjs

      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .agent/state.json
          if git diff --cached --quiet; then
            echo "nothing staged after all - not committing"
            exit 0
          fi
          # The chore(pipeline) prefix is what guard 1 above keys on. Do not change
          # it in one place without changing it in the other.
          git commit -m "chore(pipeline): refresh index and state"
          git push

      - name: Summarise
        if: always()
        run: |
          {
            echo "### NeetCode pipeline"
            echo ""
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- selected folders: **${{ steps.detect.outputs.count }}**"
            echo "- wrote a commit: **${{ steps.apply.outputs.changed == 'true' && 'yes' || 'no' }}**"
            echo ""
            echo '```json'
            cat "$RUNNER_TEMP/detect.json" 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
