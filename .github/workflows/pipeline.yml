name: NeetCode pipeline

# ---------------------------------------------------------------------------
# Detect -> classify -> rename and header -> refresh index -> commit.
#
# Authentication is CLAUDE_CODE_OAUTH_TOKEN, which bills your Claude
# subscription. Never add ANTHROPIC_API_KEY: it outranks the OAuth token in
# non-interactive mode and would silently move you to per-token billing.
#
# --bare is deliberately NOT used. Bare mode does not read
# CLAUDE_CODE_OAUTH_TOKEN, so it and the subscription are mutually exclusive.
# The "Guard" step below recovers the safety half of what --bare would give.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - '**/submission-*'
  schedule:
    # Twice a day, morning and evening IST. These are two separate runs, not a
    # run and a catch-up: whatever the morning one leaves - a folder held back
    # by a push, a folder whose classify was refused - the evening one picks up,
    # and vice versa. An idle run finds nothing pending, calls no model, and
    # costs a runner start.
    #
    # Cron here is UTC and IST is UTC+5:30, so subtract 5h30m from the time you
    # want. Both land on odd minutes on purpose: GitHub queues scheduled
    # workflows at low priority, and :00, :15, :30 and :45 are where everyone
    # else's schedules pile up.
    #
    # None of this is a promise. GitHub makes no timing guarantee for scheduled
    # workflows on hosted runners - one of these was once four and a half hours
    # adrift - and a late run does the same work correctly, only later. Trigger
    # it by hand if you need it now.
    - cron: '37 1 * * *'    # 07:07 IST
    - cron: '39 13 * * *'   # 19:09 IST
  workflow_dispatch:
    # Three boxes, and the third only matters when the first is empty.
    #
    #   Process-Specific-folder   Back-Fill   what the run does
    #   -----------------------   ---------   ---------------------------------
    #   empty                     off         whatever is pending. The ordinary
    #                                         manual run.
    #   set                       off         those folders, brought up to the
    #                                         current standard.
    #   set                       on          those folders, redone from scratch.
    #   empty                     on          the backlog, Back-Fill-Limit
    #                                         folders of it.
    #
    # The labels are just the names. GitHub renders `description` as the label
    # above the box and supports no placeholder, so an explanation here would
    # sit on screen permanently, every run, for the life of the workflow. The
    # explanation lives in COMMANDS.md, which is read once.
    inputs:
      Process-Specific-folder:
        description: 'Process-Specific-folder'
        required: false
        default: ''
      Back-Fill:
        description: 'Back-Fill'
        required: false
        type: boolean
        default: false
      Back-Fill-Limit:
        description: 'Back-Fill-Limit'
        required: false
        default: '5'

concurrency:
  group: neetcode-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # LOOP GUARD 1 of 2: refuse to act on the pipeline's own commits.
    # LOOP GUARD 2 of 2: those commits are pushed with the built-in GITHUB_TOKEN,
    # whose pushes do not start new workflow runs. Swapping in a personal access
    # token defeats guard 2 - do not introduce one.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(pipeline)')

    steps:
      - name: Check out the tip of main, not the commit that triggered this run
        uses: actions/checkout@v7
        with:
          # THE DEFAULT IS github.sha - the commit that set this run off - and on
          # a queued run that is behind main. Submit twice in quick succession
          # and the second run rewinds past everything the first one finished:
          #
          #   git rev-parse origin/main          -> eb2f696   (run 1's work)
          #   git fetch +7649a6c:origin/main     (forced update)
          #   git log -1                         -> 7649a6c   (behind)
          #
          # It then redid a folder run 1 had already curated - lint, classify,
          # two teaching blocks and a visualizer - and could not push, because
          # rebasing hit add/add conflicts on the optimal.cs and visualizer run 1
          # had just created. Roughly $1.10, spent to produce a conflict.
          #
          # Starting from the tip instead means a queued run sees the finished
          # work and skips it. The folder this push touched is still held back:
          # detect excludes anything with a submission changed since
          # github.event.before, which from the tip covers this push and any that
          # overtook it.
          ref: main
          # detect.mjs diffs against the pre-push SHA; a shallow clone cannot.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Detect pending submissions
        id: detect
        env:
          # Empty on cron and manual runs - which is what makes those drain
          # everything, including the folder a push would have held back.
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          args=()
          # Explicit ifs rather than `[ -n "$X" ] && args+=(...)`. Bash exempts a
          # failing left-hand side of an && list from set -e, so both forms work
          # here - but the && form returns non-zero, and if such a line ever ends
          # up last in a step it becomes the step's exit code. Not worth the trap.
          if [ -n "$BEFORE_SHA" ]; then
            args+=(--exclude-changed-since "$BEFORE_SHA")
          fi
          node scripts/detect.mjs "${args[@]}"
          node scripts/detect.mjs "${args[@]}" --json > "$RUNNER_TEMP/detect.json"

      - name: Guard - repo must carry no Claude Code config
        run: |
          set -euo pipefail
          # Without --bare, `claude -p` executes hooks from .claude/settings.json
          # and connects servers from .mcp.json found in the checked-out repo,
          # with no trust prompt. Neither belongs here, so their appearance is
          # either a mistake or an attack. Refuse to run the model either way.
          bad=0
          for path in .claude .mcp.json; do
            if [ -e "$path" ]; then echo "::error::$path exists in the repo; refusing to run the model"; bad=1; fi
          done
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is set; it outranks the subscription token. Refusing."
            bad=1
          fi
          [ "$bad" -eq 0 ] && echo "clean"

      - name: Resolve the folders you named
        id: named
        if: github.event.inputs['Process-Specific-folder'] != ''
        env:
          ONLY: ${{ github.event.inputs['Process-Specific-folder'] }}
        run: |
          set -euo pipefail
          # Fail here rather than three steps later. A slug with a typo is not an
          # error to any single script - classify just says "no folder with that
          # slug" and exits 0 - so the run would go green having done nothing.
          node scripts/resolve-slugs.mjs "$ONLY"

      - name: Guard - the deterministic half must still work
        run: |
          # The decisions the pipeline makes for itself - what lint may rewrite,
          # which file is called optimal.cs, what a header claims about its
          # neighbour - are pure functions with tests. They cost nothing to run
          # and they are where the expensive mistakes live, so run every one
          # before spending a model call. Anything matching the glob is picked
          # up, so a new test file needs no change here.
          for t in scripts/lib/*.test.mjs; do echo "--- $t"; node "$t"; done

      - name: Guard - every solution file must still compile
        run: |
          set -euo pipefail
          # The .cs files are the point of this repo, and they are the one thing a
          # backfill cannot rebuild - everything else is generated commentary. Nothing
          # else here checks they are valid C#: sameShape() proves a rewrite changed no
          # token, which says nothing about whether either version compiles. A rename
          # onto a keyword, a mangled generic, a lost brace - all pass every other check
          # and fail at the grader.
          #
          # One project, one build, each file in its own namespace so the sixty
          # `public class Solution` declarations do not collide. Seconds, and free.
          node scripts/compile-check.mjs

      - name: Guard - the formatter must be there
        run: |
          set -euo pipefail
          # Spacing is done by `dotnet format whitespace`, not by the model. The SDK is
          # preinstalled on ubuntu-24.04 (8.x, 9.x and 10.x), so there is no setup-dotnet
          # step and nothing to install - but lint degrades QUIETLY when dotnet is absent,
          # and a pipeline that silently stops doing half its job is the exact failure
          # this repo has already been bitten by. So assert it, here, before anything runs.
          if ! command -v dotnet >/dev/null; then
            echo "::error::dotnet is not on PATH; lint would skip formatting silently. Add actions/setup-dotnet."
            exit 1
          fi
          dotnet --version
          # Prove the tool is the whitespace-only one, on a file shaped like the one that
          # broke house-robber: a braceless `if`. If a future SDK ever starts adding the
          # braces here, lint's sameShape() would refuse every file it touches - so find
          # out now, for free, rather than four model calls later.
          tmp="$(mktemp -d)"
          cp .editorconfig "$tmp/" 2>/dev/null || true
          printf 'public class S\n{\n    public int F(int n)\n    {\n        if(n == 1)\n        return 0;\n        return n;\n    }\n}\n' > "$tmp/S.cs"
          DOTNET_NOLOGO=1 dotnet format whitespace --folder "$tmp" --verbosity quiet
          if grep -q '{' <<< "$(sed -n '/if (n == 1)/,+1p' "$tmp/S.cs")"; then
            echo "::error::dotnet format added braces to a braceless if - it is no longer whitespace-only"
            cat "$tmp/S.cs"
            exit 1
          fi
          echo "formatter is whitespace-only, as expected"

      - name: Install Claude Code
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        # PINNED. An unpinned install takes whatever was released that morning, and a release can
        # change a default under us - the docs say --bare will become the default for -p, and bare
        # mode does not read the subscription token, so every model step would fail to log in.
        # To upgrade: install the new version locally, run `node scripts/probe-cli.mjs` (probes A-H
        # must all PASS), then change the number here.
        env:
          CLAUDE_CODE_VERSION: '2.1.273'
        run: |
          set -euo pipefail
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          got="$(claude --version | awk '{print $1}')"
          echo "claude $got"
          if [ "$got" != "$CLAUDE_CODE_VERSION" ]; then
            echo "::error::expected Claude Code $CLAUDE_CODE_VERSION, got $got"
            exit 1
          fi

      - name: Choose the backfill batch
        id: batch
        if: github.event.inputs['Back-Fill'] == 'true' && github.event.inputs['Process-Specific-folder'] == ''
        run: node scripts/select-backfill.mjs --limit "${{ github.event.inputs['Back-Fill-Limit'] || '5' }}"

      - name: Format the solution code
        id: lint
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        # NO MODEL, NO TOKEN. This step used to ask Haiku to rename local variables as
        # well as tidy spacing; the renaming is gone (lint.mjs explains why, with the
        # audit that ended it) and what is left is `dotnet format whitespace`, which is
        # deterministic and free. It keeps its place at the front of the pipeline so a
        # file is in its final shape before anything describes it.
        #
        # It still fails fast, but now only for one reason: sameShape() caught the
        # formatter changing a token, which would mean it is no longer whitespace-only
        # and the design of this step is broken.
        env:
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          BATCH: ${{ github.event.inputs['Process-Specific-folder'] || steps.batch.outputs.slugs }}
          NAMED: ${{ github.event.inputs['Process-Specific-folder'] }}
          LIMIT_IN: ${{ github.event.inputs['Back-Fill-Limit'] }}
          # Formatting again costs nothing, so Back-Fill just means "do it anyway",
          # e.g. to roll out an .editorconfig change.
          REDO: ${{ github.event.inputs['Back-Fill'] == 'true' && 'yes' || '' }}
        run: |
          set -euo pipefail
          # A named list is not a queue: process all of it, whatever --limit says.
          limit="${LIMIT_IN:-5}"
          if [ -n "${NAMED:-}" ]; then limit=0; fi
          args=(--apply --limit "$limit")
          if [ -n "${BATCH:-}" ]; then
            args+=(--slug "$BATCH")
          fi
          if [ -n "${REDO:-}" ]; then
            args+=(--force)
          fi
          if [ -n "$BEFORE_SHA" ]; then
            args+=(--exclude-changed-since "$BEFORE_SHA")
          fi
          node scripts/lint.mjs "${args[@]}"

      - name: Classify, rename and write headers
        id: classify
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        # Fail fast - see the note on the lint step.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          # A named folder is an explicit instruction; the backfill batch is a
          # queue. Naming folders wins, and the queue is not consulted at all.
          BATCH: ${{ github.event.inputs['Process-Specific-folder'] || steps.batch.outputs.slugs }}
          NAMED: ${{ github.event.inputs['Process-Specific-folder'] }}
          LIMIT_IN: ${{ github.event.inputs['Back-Fill-Limit'] }}
        run: |
          set -euo pipefail
          # A named list is not a queue: process all of it, whatever --limit says.
          limit="${LIMIT_IN:-5}"
          if [ -n "${NAMED:-}" ]; then limit=0; fi
          args=(--apply --verbose --limit "$limit")
          if [ -n "${BATCH:-}" ]; then
            args+=(--slug "$BATCH")
          fi
          if [ -n "$BEFORE_SHA" ]; then
            args+=(--exclude-changed-since "$BEFORE_SHA")
          fi
          node scripts/classify.mjs "${args[@]}"

      - name: Write teaching blocks
        id: teach
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        # Fail fast - see the note on the lint step.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          # classify renames the raw submissions away, so teach cannot rediscover
          # what was just processed - it has to be told.
          APPLIED: ${{ steps.classify.outputs.applied }}
          # A named folder is an explicit instruction; the backfill batch is a
          # queue. Naming folders wins, and the queue is not consulted at all.
          BATCH: ${{ github.event.inputs['Process-Specific-folder'] || steps.batch.outputs.slugs }}
          NAMED: ${{ github.event.inputs['Process-Specific-folder'] }}
          LIMIT_IN: ${{ github.event.inputs['Back-Fill-Limit'] }}
          REDO: ${{ github.event.inputs['Back-Fill'] == 'true' && 'yes' || '' }}
        run: |
          set -euo pipefail
          # A named list is not a queue: process all of it, whatever --limit says.
          limit="${LIMIT_IN:-5}"
          if [ -n "${NAMED:-}" ]; then limit=0; fi
          args=(--apply --limit "$limit")
          if [ -n "${BATCH:-}" ]; then
            # No --force by default: headerSignature now carries a fingerprint of the code,
            # so a lint rename invalidates the block and it is rewritten anyway.
            # Forcing spent a model call rewriting blocks that were already correct.
            args+=(--slug "$BATCH")
          elif [ -n "${APPLIED:-}" ]; then
            # --unfinished: also finish any folder a failed earlier run stopped before teach.
            args+=(--slug "$APPLIED" --unfinished)
          else
            # classify processed nothing, but an earlier failed run may have left a folder
            # classified with no teaching block. Normally this finds nothing and calls no model.
            args+=(--unfinished)
          fi
          if [ -n "${NAMED:-}" ] && [ -n "${REDO:-}" ]; then
            args+=(--force)
          fi
          node scripts/teach.mjs "${args[@]}"

      - name: Build visualizers for problems that have none
        id: visualize
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        # Fail fast - see the note on the lint step.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          # A named folder is an explicit instruction; the backfill batch is a
          # queue. Naming folders wins, and the queue is not consulted at all.
          BATCH: ${{ github.event.inputs['Process-Specific-folder'] || steps.batch.outputs.slugs }}
          NAMED: ${{ github.event.inputs['Process-Specific-folder'] }}
          LIMIT_IN: ${{ github.event.inputs['Back-Fill-Limit'] }}
          APPLIED: ${{ steps.classify.outputs.applied }}
          REDO: ${{ github.event.inputs['Back-Fill'] == 'true' && 'yes' || '' }}
        run: |
          set -euo pipefail
          # A named list is not a queue: process all of it, whatever --limit says.
          limit="${LIMIT_IN:-5}"
          if [ -n "${NAMED:-}" ]; then limit=0; fi
          args=(--apply --limit "$limit")
          if [ -n "${BATCH:-}" ]; then
            args+=(--slug "$BATCH")
            # --backfill here means "replace a visualizer that already exists",
            # including the ones built by hand. Naming a folder must not silently
            # destroy a hand-built animation, so a named run only replaces one
            # when backfill says to redo. Without it, a visualizer is still
            # rebuilt when lint changed the code it animates - that is the
            # recorded code print's job, not this flag's.
            if [ -n "${REDO:-}" ]; then
              args+=(--backfill)
            fi
          elif [ -n "${APPLIED:-}" ]; then
            # Scope to what classify just processed. Unscoped, this step targets
            # ANY folder lacking a visualizer, so a run could spend a model call on an
            # unrelated folder and, under a small --limit, skip the problem you
            # actually just solved. Folders missing a visualizer for other
            # reasons are backfill's job - select-backfill already counts them.
            args+=(--slug "$APPLIED" --unfinished)
          else
            # See the teach step: finishes a folder a failed earlier run left without a visualizer.
            args+=(--unfinished)
          fi
          node scripts/visualize.mjs "${args[@]}"

      - name: Apply - refresh index and state
        id: apply
        # Runs even after a failed step, so the index and state match what IS on disk.
        if: ${{ !cancelled() }}
        run: node scripts/apply.mjs

      - name: Commit and push
        id: commit
        # Runs even after a failed step. Stopping must not throw away what already finished -
        # lint's renames in other folders, and state.json recording which file failed. The
        # job is still red, because the failed step already marked it so.
        if: ${{ !cancelled() }}
        # Deliberately ungated. It used to run only when apply.mjs reported a
        # change, but that flag covers only README, index.md and state.json -
        # the files apply itself writes. lint, teach and visualize write .cs and
        # .html directly, so a run that linted a file, wrote a teaching block and
        # built a visualizer could still be skipped here and have every one of
        # them destroyed with the runner. The staged-changes check below is the
        # correct no-op guard; this one was measuring the wrong thing.
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Every path the pipeline can write. A file regenerated on the runner but
          # not staged here is silently discarded when the runner is destroyed -
          # index.md was exactly that, so the Pages site would never have updated.
          for f in README.md index.html index.md .agent/state.json; do
            if [ -e "$f" ] || git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              git add -A -- "$f"
            fi
          done
          git add -A -- "Data Structures & Algorithms"
          if git diff --cached --quiet; then
            echo "nothing staged after all - not committing"
            exit 0
          fi
          # The chore(pipeline) prefix is what guard 1 above keys on. Do not change
          # it in one place without changing it in the other.
          git commit -m "chore(pipeline): refresh index and state"

          # A run takes minutes, and the checkout is from the minute it began.
          # Submit two problems back to back and the second push lands on main
          # while the first run is still working - so its push is rejected as
          # non-fast-forward, and every model call it made dies with the runner.
          # That happened for real: lint, classify, two teaching blocks and a
          # visualizer, all discarded, then redone identically by the next run.
          #
          # Nothing about the work is stale, only the base it sits on, so rebase
          # onto whatever arrived and try again. The competing push is a NeetCode
          # submission in some other folder - concurrency already serialises the
          # pipeline against itself - so the rebase is expected to be clean, and
          # a conflict means something unforeseen and is reported, not forced.
          pushed=0
          for attempt in 1 2 3; do
            if git push; then pushed=1; break; fi
            echo "push rejected (attempt $attempt) - main moved while this run was working"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase onto origin/main conflicted - the work is committed on the runner but could not be pushed"
              exit 1
            fi
            echo "rebased onto $(git rev-parse --short origin/main); retrying"
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::push still rejected after 3 attempts - main is moving faster than this run can rebase"
            exit 1
          fi

      - name: Summarise
        if: always()
        env:
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          DETECT_JSON: ${{ runner.temp }}/detect.json
          NAMED_BATCH: ${{ github.event.inputs['Process-Specific-folder'] }}
          REDO: ${{ github.event.inputs['Back-Fill'] == 'true' && 'yes' || '' }}
          BACKFILL_BATCH: ${{ steps.batch.outputs.slugs }}
          BACKFILL_REMAINING: ${{ steps.batch.outputs.remaining }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          # So the summary can say which step stopped the run and which were never reached.
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_CLASSIFY: ${{ steps.classify.outcome }}
          OUTCOME_TEACH: ${{ steps.teach.outcome }}
          OUTCOME_VISUALIZE: ${{ steps.visualize.outcome }}
          OUTCOME_COMMIT: ${{ steps.commit.outcome }}
        run: node scripts/summarise.mjs
