name: NeetCode pipeline

# ---------------------------------------------------------------------------
# Detect -> classify -> rename and header -> refresh index -> commit.
#
# Authentication is CLAUDE_CODE_OAUTH_TOKEN, which bills your Claude
# subscription. Never add ANTHROPIC_API_KEY: it outranks the OAuth token in
# non-interactive mode and would silently move you to per-token billing.
#
# --bare is deliberately NOT used. Bare mode does not read
# CLAUDE_CODE_OAUTH_TOKEN, so it and the subscription are mutually exclusive.
# The "Guard" step below recovers the safety half of what --bare would give.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - '**/submission-*'
  schedule:
    # Twice a day, morning and evening IST. These are two separate runs, not a
    # run and a catch-up: whatever the morning one leaves - a folder held back
    # by a push, a folder whose classify was refused - the evening one picks up,
    # and vice versa. An idle run finds nothing pending, calls no model, and
    # costs a runner start.
    #
    # Cron here is UTC and IST is UTC+5:30, so subtract 5h30m from the time you
    # want. Both land on odd minutes on purpose: GitHub queues scheduled
    # workflows at low priority, and :00, :15, :30 and :45 are where everyone
    # else's schedules pile up.
    #
    # None of this is a promise. GitHub makes no timing guarantee for scheduled
    # workflows on hosted runners - one of these was once four and a half hours
    # adrift - and a late run does the same work correctly, only later. Trigger
    # it by hand if you need it now.
    - cron: '37 1 * * *'    # 07:07 IST
    - cron: '39 13 * * *'   # 19:09 IST
  workflow_dispatch:
    # Three boxes, and the third only matters when the first is empty.
    #
    #   Process-Specific-folder   Back-Fill   what the run does
    #   -----------------------   ---------   ---------------------------------
    #   empty                     off         whatever is pending. The ordinary
    #                                         manual run.
    #   set                       off         those folders, brought up to the
    #                                         current standard.
    #   set                       on          those folders, redone from scratch.
    #   empty                     on          the backlog, Back-Fill-Limit
    #                                         folders of it.
    #
    # The labels are just the names. GitHub renders `description` as the label
    # above the box and supports no placeholder, so an explanation here would
    # sit on screen permanently, every run, for the life of the workflow. The
    # explanation lives in COMMANDS.md, which is read once.
    inputs:
      Process-Specific-folder:
        description: 'Process-Specific-folder'
        required: false
        default: ''
      Back-Fill:
        description: 'Back-Fill'
        required: false
        type: boolean
        default: false
      Back-Fill-Limit:
        description: 'Back-Fill-Limit'
        required: false
        default: '5'

concurrency:
  group: neetcode-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    # LOOP GUARD 1 of 2: refuse to act on the pipeline's own commits.
    # LOOP GUARD 2 of 2: those commits are pushed with the built-in GITHUB_TOKEN,
    # whose pushes do not start new workflow runs. Swapping in a personal access
    # token defeats guard 2 - do not introduce one.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(pipeline)')

    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          # detect.mjs diffs against the pre-push SHA; a shallow clone cannot.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Detect pending submissions
        id: detect
        env:
          # Empty on cron and manual runs - which is what makes those drain
          # everything, including the folder a push would have held back.
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          set -euo pipefail
          args=()
          # Explicit ifs rather than `[ -n "$X" ] && args+=(...)`. Bash exempts a
          # failing left-hand side of an && list from set -e, so both forms work
          # here - but the && form returns non-zero, and if such a line ever ends
          # up last in a step it becomes the step's exit code. Not worth the trap.
          if [ -n "$BEFORE_SHA" ]; then
            args+=(--exclude-changed-since "$BEFORE_SHA")
          fi
          node scripts/detect.mjs "${args[@]}"
          node scripts/detect.mjs "${args[@]}" --json > "$RUNNER_TEMP/detect.json"

      - name: Guard - repo must carry no Claude Code config
        run: |
          set -euo pipefail
          # Without --bare, `claude -p` executes hooks from .claude/settings.json
          # and connects servers from .mcp.json found in the checked-out repo,
          # with no trust prompt. Neither belongs here, so their appearance is
          # either a mistake or an attack. Refuse to run the model either way.
          bad=0
          for path in .claude .mcp.json; do
            if [ -e "$path" ]; then echo "::error::$path exists in the repo; refusing to run the model"; bad=1; fi
          done
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is set; it outranks the subscription token. Refusing."
            bad=1
          fi
          [ "$bad" -eq 0 ] && echo "clean"

      - name: Resolve the folders you named
        id: named
        if: github.event.inputs['Process-Specific-folder'] != ''
        env:
          ONLY: ${{ github.event.inputs['Process-Specific-folder'] }}
        run: |
          set -euo pipefail
          # Fail here rather than three steps later. A slug with a typo is not an
          # error to any single script - classify just says "no folder with that
          # slug" and exits 0 - so the run would go green having done nothing.
          node scripts/resolve-slugs.mjs "$ONLY"

      - name: Guard - the lint safety check must still work
        run: |
          # sameShape() is the only thing standing between the lint model and
          # the code. If its own test suite fails, the guard has a hole or a
          # false alarm - stop before spending a single model call.
          node scripts/lib/csharp.test.mjs

      - name: Install Claude Code
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Choose the backfill batch
        id: batch
        if: github.event.inputs['Back-Fill'] == 'true' && github.event.inputs['Process-Specific-folder'] == ''
        run: node scripts/select-backfill.mjs --limit "${{ github.event.inputs['Back-Fill-Limit'] || '5' }}"

      - name: Lint - spacing and variable names
        id: lint
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          # A named folder is an explicit instruction; the backfill batch is a
          # queue. Naming folders wins, and the queue is not consulted at all.
          BATCH: ${{ github.event.inputs['Process-Specific-folder'] || steps.batch.outputs.slugs }}
          NAMED: ${{ github.event.inputs['Process-Specific-folder'] }}
          LIMIT_IN: ${{ github.event.inputs['Back-Fill-Limit'] }}
          REDO: ${{ github.event.inputs['Back-Fill'] == 'true' && 'yes' || '' }}
        run: |
          set -euo pipefail
          # Lint runs BEFORE classify. The header, the teaching block and the
          # visualizer all name variables, so renaming after they are written
          # would leave every one of them describing code that no longer exists.
          # A named list is not a queue: process all of it, whatever --limit says.
          limit="${LIMIT_IN:-5}"
          if [ -n "${NAMED:-}" ]; then limit=0; fi
          args=(--apply --limit "$limit")
          if [ -n "${BATCH:-}" ]; then
            args+=(--slug "$BATCH")
          fi
          if [ -n "${NAMED:-}" ] && [ -n "${REDO:-}" ]; then
            # Also the only way back for a file lint recorded as failed twice.
            args+=(--force)
          fi
          if [ -n "$BEFORE_SHA" ]; then
            args+=(--exclude-changed-since "$BEFORE_SHA")
          fi
          node scripts/lint.mjs "${args[@]}"

      - name: Classify, rename and write headers
        id: classify
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          # A named folder is an explicit instruction; the backfill batch is a
          # queue. Naming folders wins, and the queue is not consulted at all.
          BATCH: ${{ github.event.inputs['Process-Specific-folder'] || steps.batch.outputs.slugs }}
          NAMED: ${{ github.event.inputs['Process-Specific-folder'] }}
          LIMIT_IN: ${{ github.event.inputs['Back-Fill-Limit'] }}
        run: |
          set -euo pipefail
          # A named list is not a queue: process all of it, whatever --limit says.
          limit="${LIMIT_IN:-5}"
          if [ -n "${NAMED:-}" ]; then limit=0; fi
          args=(--apply --verbose --limit "$limit")
          if [ -n "${BATCH:-}" ]; then
            args+=(--slug "$BATCH")
          fi
          if [ -n "$BEFORE_SHA" ]; then
            args+=(--exclude-changed-since "$BEFORE_SHA")
          fi
          node scripts/classify.mjs "${args[@]}"

      - name: Write teaching blocks
        id: teach
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          # classify renames the raw submissions away, so teach cannot rediscover
          # what was just processed - it has to be told.
          APPLIED: ${{ steps.classify.outputs.applied }}
          # A named folder is an explicit instruction; the backfill batch is a
          # queue. Naming folders wins, and the queue is not consulted at all.
          BATCH: ${{ github.event.inputs['Process-Specific-folder'] || steps.batch.outputs.slugs }}
          NAMED: ${{ github.event.inputs['Process-Specific-folder'] }}
          LIMIT_IN: ${{ github.event.inputs['Back-Fill-Limit'] }}
          REDO: ${{ github.event.inputs['Back-Fill'] == 'true' && 'yes' || '' }}
        run: |
          set -euo pipefail
          # A named list is not a queue: process all of it, whatever --limit says.
          limit="${LIMIT_IN:-5}"
          if [ -n "${NAMED:-}" ]; then limit=0; fi
          args=(--apply --limit "$limit")
          if [ -n "${BATCH:-}" ]; then
            # No --force by default: headerSignature now carries a fingerprint of the code,
            # so a lint rename invalidates the block and it is rewritten anyway.
            # Forcing spent Opus rewriting blocks that were already correct.
            args+=(--slug "$BATCH")
          elif [ -n "${APPLIED:-}" ]; then
            args+=(--slug "$APPLIED")
          else
            echo "classify processed nothing - no teaching blocks to write"
            exit 0
          fi
          if [ -n "${NAMED:-}" ] && [ -n "${REDO:-}" ]; then
            args+=(--force)
          fi
          node scripts/teach.mjs "${args[@]}"

      - name: Build visualizers for problems that have none
        id: visualize
        if: steps.detect.outputs.count != '0' || github.event.inputs['Back-Fill'] == 'true' || github.event.inputs['Process-Specific-folder'] != ''
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          # A named folder is an explicit instruction; the backfill batch is a
          # queue. Naming folders wins, and the queue is not consulted at all.
          BATCH: ${{ github.event.inputs['Process-Specific-folder'] || steps.batch.outputs.slugs }}
          NAMED: ${{ github.event.inputs['Process-Specific-folder'] }}
          LIMIT_IN: ${{ github.event.inputs['Back-Fill-Limit'] }}
          APPLIED: ${{ steps.classify.outputs.applied }}
          REDO: ${{ github.event.inputs['Back-Fill'] == 'true' && 'yes' || '' }}
        run: |
          set -euo pipefail
          # A named list is not a queue: process all of it, whatever --limit says.
          limit="${LIMIT_IN:-5}"
          if [ -n "${NAMED:-}" ]; then limit=0; fi
          args=(--apply --limit "$limit")
          if [ -n "${BATCH:-}" ]; then
            args+=(--slug "$BATCH")
            # --backfill here means "replace a visualizer that already exists",
            # including the ones built by hand. Naming a folder must not silently
            # destroy a hand-built animation, so a named run only replaces one
            # when backfill says to redo. Without it, a visualizer is still
            # rebuilt when lint changed the code it animates - that is the
            # recorded code print's job, not this flag's.
            if [ -n "${REDO:-}" ]; then
              args+=(--backfill)
            fi
          elif [ -n "${APPLIED:-}" ]; then
            # Scope to what classify just processed. Unscoped, this step targets
            # ANY folder lacking a visualizer, so a run could spend Opus on an
            # unrelated folder and, under a small --limit, skip the problem you
            # actually just solved. Folders missing a visualizer for other
            # reasons are backfill's job - select-backfill already counts them.
            args+=(--slug "$APPLIED")
          else
            echo "classify processed nothing - no visualizers to build"
            exit 0
          fi
          node scripts/visualize.mjs "${args[@]}"

      - name: Apply - refresh index and state
        id: apply
        run: node scripts/apply.mjs

      - name: Commit and push
        id: commit
        # Deliberately ungated. It used to run only when apply.mjs reported a
        # change, but that flag covers only README, index.md and state.json -
        # the files apply itself writes. lint, teach and visualize write .cs and
        # .html directly, so a run that linted a file, wrote a teaching block and
        # built a visualizer could still be skipped here and have every one of
        # them destroyed with the runner. The staged-changes check below is the
        # correct no-op guard; this one was measuring the wrong thing.
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Every path the pipeline can write. A file regenerated on the runner but
          # not staged here is silently discarded when the runner is destroyed -
          # index.md was exactly that, so the Pages site would never have updated.
          git add -- README.md index.md .agent/state.json
          git add -A -- "Data Structures & Algorithms"
          if git diff --cached --quiet; then
            echo "nothing staged after all - not committing"
            exit 0
          fi
          # The chore(pipeline) prefix is what guard 1 above keys on. Do not change
          # it in one place without changing it in the other.
          git commit -m "chore(pipeline): refresh index and state"
          git push

      - name: Summarise
        if: always()
        env:
          PIPELINE_REPORT: ${{ runner.temp }}/pipeline-report.tsv
          DETECT_JSON: ${{ runner.temp }}/detect.json
          NAMED_BATCH: ${{ github.event.inputs['Process-Specific-folder'] }}
          REDO: ${{ github.event.inputs['Back-Fill'] == 'true' && 'yes' || '' }}
          BACKFILL_BATCH: ${{ steps.batch.outputs.slugs }}
          BACKFILL_REMAINING: ${{ steps.batch.outputs.remaining }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/summarise.mjs
